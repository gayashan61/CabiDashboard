<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin · Production KPI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/config.js"></script>
<script src="assets/theme.js"></script>
<style>
  html { font-size: 15px; }
  body { font-size: 14px; }
  .appbar { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border); box-shadow: var(--shadow); }
  .appbar-in { max-width: 1240px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 14px; }
  .appbar .brand-mark { width: 36px; height: 36px; border-radius: 10px; }
  .appbar .brand-mark svg { width: 20px; height: 20px; }
  .appbar .brand-title { font-size: 17px; }
  .appbar .brand-eyebrow { font-size: 11px; }
  .appbar .sp { flex: 1; }
  .appbar .icon-btn { width: 36px; height: 36px; }
  .screens { display: flex; gap: 6px; }
  .screens .btn { box-shadow: none; padding: 7px 12px; }
  .screens .btn svg { color: var(--accent-ink); }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 20px; }
  .page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 6px 0 18px; flex-wrap: wrap; }
  .page-h h1 { font-size: 24px; margin: 0; letter-spacing: -0.02em; }
  .page-h p { margin: 4px 0 0; color: var(--muted); }
  .tabs { display: inline-flex; gap: 2px; padding: 4px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 18px; overflow-x: auto; max-width: 100%; }
  .tabs button { background: none; border: 0; color: var(--ink-2); padding: 8px 16px; font: inherit; font-weight: 500; cursor: pointer; border-radius: 7px; white-space: nowrap; }
  .tabs button:hover { color: var(--ink); }
  .tabs button.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }
  input, select { background: var(--surface); color: var(--ink); border: 1px solid var(--axis); border-radius: 8px; padding: 8px 10px; font: inherit; transition: border-color .15s, box-shadow .15s; }
  input:hover, select:hover { border-color: var(--muted); }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input.num { width: 100%; text-align: right; font-variant-numeric: tabular-nums; }
  input.changed { border-color: var(--warning); background: var(--warning-soft); }
  input.bad { border-color: var(--critical); background: var(--critical-soft); }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar .sp { flex: 1; }
  .toolbar .datebig { font-weight: 600; font-size: 15px; margin-left: 6px; }
  .hint { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .dept-h { margin: 24px 0 10px; font-size: 12px; color: var(--muted); display: flex; align-items: center; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .dept-h::after { content: ""; flex: 1; height: 1px; background: var(--border); margin-left: 12px; }
  .wrap.wide { max-width: none; }
  /* department tabs above the daily sheet */
  .dtabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .dtabs button { display: inline-flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--border); color: var(--ink-2); padding: 7px 14px; border-radius: 999px; font: inherit; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .dtabs button:hover { border-color: var(--axis); color: var(--ink); }
  .dtabs button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
  .dtabs button .dept-dot { margin-right: 6px; }
  .dtabs .n { margin-left: 8px; min-width: 20px; padding: 1px 6px; border-radius: 999px; background: var(--surface-3); color: var(--ink-2); font-size: 11px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; }
  .dtabs button.on .n { background: var(--accent); color: var(--on-accent); }
  /* daily entry sheet: jobs down the side, people across the top (like the Excel sheet) */
  .eg-wrap { overflow: auto; max-height: calc(100vh - 380px); min-height: 320px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
  table.eg { border-collapse: separate; border-spacing: 0; font-size: 13px; }
  .eg th, .eg td { border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); padding: 0; height: 34px; background: var(--surface); }
  .eg thead th { position: sticky; top: 0; z-index: 3; background: var(--surface-2); color: var(--ink-2); font-weight: 600; font-size: 12px; padding: 0 6px; white-space: nowrap; text-align: center; }
  .eg tfoot th, .eg tfoot td { position: sticky; bottom: 0; z-index: 3; background: var(--surface-2); color: var(--ink-2); font-size: 12px; text-align: center; border-top: 1px solid var(--border); }
  .eg tfoot td.none { color: var(--muted); }
  .eg .c-job { position: sticky; left: 0; z-index: 2; text-align: left; padding: 0 10px; width: 220px; min-width: 220px; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .eg .c-unit { position: sticky; left: 220px; z-index: 2; color: var(--muted); padding: 0 8px; width: 70px; min-width: 70px; font-size: 12px; box-shadow: 1px 0 0 var(--border); }
  .eg thead .c-job, .eg thead .c-unit, .eg tfoot .c-job, .eg tfoot .c-unit { z-index: 4; text-align: left; }
  .eg .c-job .m { color: var(--muted); font-weight: 400; margin-right: 6px; }
  .eg .c-p { min-width: 86px; }
  .eg td.cell { width: 86px; min-width: 86px; }
  .eg td.off { background: repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in srgb, var(--ink) 6%, transparent) 6px 7px), var(--surface-2); }
  .eg td.cell input { width: 100%; height: 100%; border: 0; border-radius: 0; background: transparent; text-align: right; padding: 0 8px; font-variant-numeric: tabular-nums; box-shadow: none; }
  .eg td.cell input:focus { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--surface); box-shadow: none; }
  .eg td.cell input.changed { background: var(--warning-soft); }
  .eg td.cell input.bad { background: var(--critical-soft); color: var(--critical-ink); }
  .eg .c-tot { text-align: right; padding: 0 10px; font-weight: 600; white-space: nowrap; min-width: 120px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .eg tr.g th { height: 30px; text-align: left; background: var(--surface-2); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .eg tr.g th span { position: sticky; left: 10px; display: inline-flex; align-items: center; }
  .eg .hl { background: var(--accent-soft) !important; color: var(--accent-ink) !important; }
  /* jobs tab */
  .jobs-card { margin-bottom: 16px; }
  .jobs-h { display: flex; align-items: center; gap: 8px; padding: 12px 14px; font-size: 15px; border-bottom: 1px solid var(--grid); }
  .jobs-h .hint { margin-left: auto; }
  .jobs-add { padding: 10px 14px; border-top: 1px solid var(--grid); }
  .job-table input { width: 100%; }
  .savebar { position: sticky; bottom: 0; z-index: 6; background: color-mix(in srgb, var(--page) 88%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--border); padding: 12px 0; display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  .tcard { padding: 0; overflow: hidden; }
  table.t { width: 100%; border-collapse: collapse; }
  table.t th, table.t td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
  table.t tr:last-child td { border-bottom: 0; }
  table.t th { color: var(--muted); font-weight: 600; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; background: var(--surface-2); }
  table.t tbody tr:hover { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; cursor: pointer; user-select: none; color: var(--muted); background: var(--surface); font-weight: 500; }
  .chip:hover { border-color: var(--axis); color: var(--ink-2); }
  .chip input { display: none; }
  .chip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
  .also-chips .chip { font-size: 11px; padding: 3px 8px; }
  .also-chips .chip[hidden] { display: none; }
  /* departments tab */
  .ord { display: flex; gap: 4px; }
  .ord .icon-btn { width: 30px; height: 30px; box-shadow: none; }
  .ord .icon-btn svg { width: 15px; height: 15px; }
  tr:first-child .ord .up, tr:last-child .ord .dn { opacity: .3; pointer-events: none; }
  .dname { display: flex; align-items: center; gap: 10px; }
  .dname input { width: 100%; max-width: 260px; }
  .swatch { width: 14px; height: 14px; border-radius: 4px; flex: 0 0 auto; }
  .dept-table input.un { width: 100%; }
  .btn.del svg { width: 14px; height: 14px; }
  .ph { display: flex; align-items: center; gap: 10px; }
  .ph-av { position: relative; cursor: pointer; display: inline-block; border-radius: 50%; }
  .ph-av input, .linkbtn input { display: none; }
  .ph-cam { position: absolute; right: -4px; bottom: -4px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--surface); }
  .ph-cam svg { width: 12px; height: 12px; }
  .ph-av:hover .av { filter: brightness(0.92); }
  .ph-act { display: flex; flex-direction: column; gap: 2px; }
  .linkbtn { background: none; border: 0; padding: 0; font: inherit; font-size: 12px; font-weight: 600; color: var(--accent-ink); cursor: pointer; text-align: left; }
  .linkbtn:hover { text-decoration: underline; }
  .linkbtn.danger { color: var(--critical-ink); }
  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; position: relative; }
  .login-wrap .theme-toggle { position: absolute; top: 16px; right: 16px; }
  .login { width: 100%; max-width: 380px; padding: 32px; box-shadow: var(--shadow-lg); }
  .login .brand-mark { width: 44px; height: 44px; border-radius: 12px; margin-bottom: 18px; }
  .login h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.02em; }
  .login label { display: block; font-size: 13px; font-weight: 600; margin: 20px 0 6px; color: var(--ink-2); }
  .login input { width: 100%; padding: 11px 12px; }
  .login button { width: 100%; padding: 11px; margin-top: 8px; }
  .err { color: var(--critical-ink); min-height: 1.4em; font-size: 13px; margin-top: 8px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 8px); background: var(--ink); color: var(--page); padding: 11px 18px; border-radius: 10px; font-weight: 600; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 9; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 8px; }
  .toast::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
  .toast.error::before { background: var(--critical); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  /* only on phones / tablets (the menus, the entry cards) */
  .appmenu, .more-menu, .hint-m { display: none; }
  .menu-pop { position: absolute; right: 0; top: calc(100% + 8px); z-index: 20; min-width: 220px; padding: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
  .menu-pop a, .menu-pop button { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: var(--ink); text-decoration: none; background: none; border: 0; font: inherit; font-weight: 500; cursor: pointer; text-align: left; }
  .menu-pop a:hover, .menu-pop button:hover { background: var(--surface-2); }
  .menu-pop svg { width: 18px; height: 18px; color: var(--accent-ink); }
  .menu-pop .who { padding: 8px 12px 10px; margin-bottom: 4px; border-bottom: 1px solid var(--grid); color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
  details > summary { list-style: none; } details > summary::-webkit-details-marker { display: none; }

  /* ───────── phones and tablets ───────── */
  @media (max-width: 1023px) {
    .appbar-in { padding: 10px 16px; gap: 8px; }
    .appbar .icon-btn, .appmenu > summary { width: 44px; height: 44px; }
    .screens, .appbar .who-inline, .appbar .sp { display: none; }
    .appmenu, .more-menu { display: block; position: relative; }
    .wrap { padding: 16px; }
    .page-h { margin: 2px 0 12px; }
    .page-h h1 { font-size: 21px; }
    .page-h p { display: none; }
    /* admin tabs: a segmented control at the top that scrolls sideways if it must */
    .tabs { display: flex; width: 100%; margin-bottom: 14px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs button { flex: 1 0 auto; min-height: 44px; padding: 0 10px; }
    input, select { font-size: 16px; min-height: 44px; }
    input[type="checkbox"] { min-height: 0; }
    .btn { min-height: 44px; }
    .toolbar .datebig, .hint-d, #export { display: none; }
    .hint-m { display: block; margin: 0 0 12px; }
    .toolbar { gap: 8px; margin-bottom: 12px; }
    .toolbar #day { flex: 1 1 0; width: 0; min-width: 0; padding: 6px 8px; }
    .toolbar #prev, .toolbar #next, .more-menu > summary { width: 44px; height: 44px; padding: 0; flex: 0 0 auto; }
    .toolbar #today { padding: 0 12px; }
    .toolbar .sp { display: none; }
    /* department chips scroll sideways in one row */
    .dtabs { flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px; padding: 2px 16px; scrollbar-width: none; flex: 1 1 100%; }
    .dtabs::-webkit-scrollbar { display: none; }
    .dtabs button { min-height: 44px; padding: 0 16px; }
    .toolbar label.hint { display: none; }
    .savebar { padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); margin-top: 12px; }
    .savebar .btn.primary { min-height: 48px; padding: 0 22px; font-size: 15px; }
    .toast { bottom: calc(86px + env(safe-area-inset-bottom)); max-width: calc(100vw - 32px); }

    /* daily entry as cards: one per task, one row per person */
    .ec { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; align-items: start; }
    .ec-dept { grid-column: 1 / -1; margin: 10px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; }
    .ec-dept:first-child { margin-top: 0; }
    .ec-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .ec-card.open { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
    .ec-h { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 14px; background: none; border: 0; font: inherit; color: var(--ink); text-align: left; cursor: pointer; }
    .ec-t { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; }
    .ec-t .m { color: var(--muted); font-weight: 500; margin-right: 6px; }
    .ec-t small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-top: 1px; }
    .ec-s { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .ec-s b { display: block; font-size: 15px; }
    .ec-s small { font-size: 12px; color: var(--muted); }
    .ec-h > svg { width: 18px; height: 18px; color: var(--muted); flex: 0 0 auto; transition: transform .2s; }
    .ec-card.open .ec-h > svg { transform: rotate(180deg); }
    .ec-b { border-top: 1px solid var(--grid); padding: 4px 14px 10px; }
    .ec-r { display: flex; align-items: center; gap: 10px; min-height: 56px; border-bottom: 1px solid var(--grid); }
    .ec-r:last-of-type { border-bottom: 0; }
    .ec-nm { flex: 1; min-width: 0; font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ec-nm small { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
    .ec-r input { width: 42%; max-width: 170px; height: 46px; text-align: right; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .ec-r input::placeholder { font-weight: 400; color: var(--muted); font-size: 14px; }
    .ec-more { width: 100%; min-height: 44px; margin-top: 6px; background: var(--surface-2); border: 1px dashed var(--axis); border-radius: 10px; color: var(--ink-2); font: inherit; font-weight: 600; cursor: pointer; }
    .ec-others { border-top: 1px dashed var(--axis); margin-top: 6px; }

    .jobs-h { flex-wrap: wrap; }
    .jobs-h .hint { margin-left: 0; flex-basis: 100%; }
    .jobs-add .btn, #add { width: 100%; }
  }
  @media (min-width: 721px) and (max-width: 1023px) {
    .ec { max-width: 720px; }
  }

  /* ───────── phones: tables become one card per row ───────── */
  @media (max-width: 720px) {
    .appbar .brand-eyebrow { display: none; }
    .tcard { overflow: visible; background: none; border: 0; box-shadow: none; }
    .jobs-card.tcard { margin-bottom: 18px; }
    .jobs-h { padding: 4px 2px 10px; border: 0; }
    .jobs-add { padding: 0; border: 0; }
    table.t, table.t tbody { display: block; }
    table.t thead { display: none; }
    table.t tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 14px; margin-bottom: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
    table.t tbody tr:hover { background: var(--surface); }
    table.t td { display: block; padding: 0; border: 0; min-width: 0; }
    table.t td[data-label]::before { content: attr(data-label); display: block; margin-bottom: 5px; font-size: 12px; font-weight: 600; color: var(--muted); }
    table.t input, table.t select { width: 100% !important; max-width: none; }
    .ord { gap: 8px; }
    .ord .icon-btn { width: 44px; height: 44px; }
    .btn.del { min-height: 44px; }
    /* Tasks: machine, task, unit, then order + remove */
    table.job-table td:nth-child(2), table.job-table td:nth-child(3), table.job-table td:nth-child(4) { grid-column: 1 / -1; }
    table.job-table td:nth-child(1) { grid-row: 4; }
    /* Departments: name, unit, people, then order + remove */
    table.dept-table td:nth-child(2), table.dept-table td:nth-child(3), table.dept-table td:nth-child(4) { grid-column: 1 / -1; }
    table.dept-table td:nth-child(1) { grid-row: 4; }
    .dname input { max-width: none; }
    /* Employees: photo + TV switch, then name, main department, other departments */
    table.emp-table td:nth-child(2), table.emp-table td:nth-child(3), table.emp-table td:nth-child(4) { grid-column: 1 / -1; }
    table.emp-table td:nth-child(5) { grid-column: 2; grid-row: 1; align-self: center; }
    table.emp-table td:nth-child(5) label { display: flex; align-items: center; gap: 8px; min-height: 44px; }
    table.emp-table .ac { width: 22px !important; height: 22px; min-height: 0; }
    .ph-act { gap: 8px; }
    .linkbtn { font-size: 14px; min-height: 28px; }
    .also-chips .chip { font-size: 13px; padding: 8px 12px; }
    .dept-add { flex-direction: column; align-items: stretch; }
    .dept-add input { width: 100% !important; }
    .login { padding: 24px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="assets/core.js"></script>
<script>
const { CFG, esc, fmtNum } = KPI;
const app = document.getElementById("app");
let data = null;
let tab = "entry";
let entryDay = KPI.todayKey();
let deptFilter = "";
let onlyMembers = true;  // with a department chosen: only its people as columns
let entryEdits = {};     // daily entry: "jobId|name" ➜ typed text, until saved
let dirty = false;
// Phones and tablets get the entry as cards (one per task) instead of the wide sheet
const NARROW = matchMedia("(max-width: 1023px)");
NARROW.addEventListener("change", () => { if (data && tab === "entry" && document.getElementById("view")) viewEntry(); });
const cardOpen = {};           // task id ➜ its entry card is open (remembered while switching tabs / days)
const othersOpen = new Set();  // task ids whose card also lists people from other departments
// Close an open ⋯ menu when tapping elsewhere or pressing Esc
document.addEventListener("click", (e) => { document.querySelectorAll("details.appmenu[open], details.more-menu[open]").forEach((d) => { if (!d.contains(e.target)) d.open = false; }); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.querySelectorAll("details.appmenu[open], details.more-menu[open]").forEach((d) => (d.open = false)); });

function toast(msg, error) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast show" + (error ? " error" : "");
  clearTimeout(t._h); t._h = setTimeout(() => (t.className = "toast"), Math.max(2600, msg.length * 70));
}
window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

const themeBtn = () => `<button class="icon-btn theme-toggle" id="theme-btn" title="Switch light / dark theme" aria-label="Switch light or dark theme">${KPI.ICONS.moon}${KPI.ICONS.sun}</button>`;
const bindTheme = () => { const b = document.getElementById("theme-btn"); if (b) b.onclick = () => KPITheme.toggle(); };

// ───────── login ─────────
function showLogin(err = "") {
  app.innerHTML = `<div class="login-wrap">${themeBtn()}<form class="card login" id="lf">
    <div class="brand-mark">${KPI.ICONS.logo}</div>
    <h1>Sign in to Admin</h1><div class="hint">${esc(CFG.COMPANY_NAME)}</div>
    <label for="em">Email</label>
    <input type="email" id="em" placeholder="you@company.com" autocomplete="username" autofocus>

    const lc = (s) => String(s || "").trim().toLowerCase();

    const missing = [];
    for (const row of grid.slice(h + 1)) {
      const [a, b, c] = [0, 1, 2].map((x) => (row[x] || "").trim());
      if (a) dept = a;
      const hasVals = colName.some((nm, idx) => nm && (row[idx] || "").trim());
      if (!c) { if (hasVals) missing.push([a, b].filter(Boolean).join(" ") || "a row without a task name"); continue; }
      const job = findJob(dept, b, c);
      if (!job) { if (hasVals) missing.push([dept, b, c].filter(Boolean).join(" ")); continue; }
      colName.forEach((nm, idx) => {
        if (!nm) return;
        const k = key(job.id, nm), val = (row[idx] || "").trim();
        if (val === text(k)) return;
        entryEdits[k] = val; if (val) n++;
      });
    }
    viewEntry();
    const warn = [missing.length && `rows not found in Tasks: ${missing.join(", ")}`, unknown.length && `not in Employees: ${unknown.join(", ")}`].filter(Boolean).join(" · ");
    toast(`Pasted the sheet — ${n} count${n === 1 ? "" : "s"} filled in. Check and click Save.${warn ? " Skipped " + warn : ""}`, !!warn);
  }
  refresh();

  const save = async () => {
    const { out, bad } = changes();
    if (!out.length || bad.length) return;
    const btn = document.getElementById("save"); btn.disabled = true; btn.textContent = "Saving…";
    try {
      await KPI.saveEntries(entryDay, out);
      await reloadData(); dirty = false; entryEdits = {};
      toast(`Saved ${out.length} count(s) for ${KPI.fmtDate(entryDay)}`); viewEntry();
    } catch (e) { btn.disabled = false; btn.textContent = "Save changes"; failed(e); }
  };
  document.getElementById("save").onclick = save;
  document.onkeydown = (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); save(); } };
}

// Loads a library from the CDN the first time it's needed.
function loadScript(src, globalName) {
  if (window[globalName]) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = () => res();
    s.onerror = () => { s.remove(); rej(new Error("could not load the Excel library — check the internet connection")); };
    document.head.appendChild(s);
  });
}

// Department colours of the light theme (--dept-1 … --dept-8 in assets/style.css), for a white Excel sheet.
const XL_DEPT = ["2A78D6", "1BAF7A", "4A3AA7", "E87BA4", "EB6834", "008300", "EDA100", "E34948"];
// One day as a formatted .xlsx Blob. val(job, person) = the count or null.
async function dayWorkbook(day, jobs, people, val) {
  const [y, m, d] = day.split("-").map(Number);
  const wb = new ExcelJS.Workbook();
  wb.creator = CFG.COMPANY_NAME;
  const ws = wb.addWorksheet(`${d}-${m}-${y}`, {
    views: [{ state: "frozen", xSplit: 4, ySplit: 4 }],
    pageSetup: { orientation: "landscape", fitToPage: true, fitToWidth: 1, fitToHeight: 0 },
  });
  const P = 5, TOT = P + people.length;               // first person column, total column
  const L = (c) => ws.getColumn(c).letter;
  const argb = (hex) => ({ argb: "FF" + hex });
  const fill = (hex) => ({ type: "pattern", pattern: "solid", fgColor: argb(hex) });
  const tint = (hex, a) => hex.match(/../g).map((h) => Math.round(255 - (255 - parseInt(h, 16)) * a).toString(16).padStart(2, "0")).join("").toUpperCase();
  const line = { style: "thin", color: argb("D9DEE7") };
  const box = (cell) => { cell.border = { top: line, left: line, bottom: line, right: line }; };
  const unitFmt = (u) => `#,##0 "${u.replace(/"/g, "")}";-#,##0;""`;
  ws.columns = [12, 14, 22, 9, ...people.map(() => 11), 16].map((width) => ({ width }));

  ws.getCell(1, 1).value = `${CFG.COMPANY_NAME} — daily counts`;
  ws.getCell(1, 1).font = { bold: true, size: 14 };
  ws.getCell(2, 1).value = KPI.fmtDate(day, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  ws.getCell(2, 1).font = { size: 11, color: argb("4B5563") };

  const hdr = ws.getRow(4);
  hdr.values = ["Dept", "Machine", "Task", "Unit", ...people.map((p) => p.name), "Total"];
  hdr.height = 22;
  for (let c = 1; c <= TOT; c++) {
    const cell = hdr.getCell(c);
    cell.font = { bold: true, color: argb("FFFFFF") }; cell.fill = fill("1F2937"); box(cell);
    cell.alignment = { vertical: "middle", horizontal: c < P ? "left" : c === TOT ? "right" : "center" };
  }

  let r = 5, dept = null;
  for (const j of jobs) {
    if (j.department !== dept) {                       // department band, like the sheet's Dept column
      dept = j.department;
      const i = KPI.deptNames(data).indexOf(dept), col = i < 0 ? "6B7280" : XL_DEPT[i % 8];
      const band = ws.getRow(r++);
      band.height = 20;
      band.getCell(1).value = dept;
      band.getCell(1).font = { bold: true, color: argb(col) };
      for (let c = 1; c <= TOT; c++) { band.getCell(c).fill = fill(tint(col, 0.16)); box(band.getCell(c)); }
    }
    const row = ws.getRow(r);
    row.getCell(2).value = j.machine || null;
    row.getCell(3).value = j.name + (j.active ? "" : " (removed)");
    row.getCell(4).value = j.unit;
    row.getCell(2).font = row.getCell(4).font = { color: argb("6B7280") };
    let sum = 0;
    people.forEach((p, k) => {
      const cell = row.getCell(P + k), q = val(j, p);
      if (q != null) { cell.value = q; sum += q; }
      cell.numFmt = "#,##0";
      if (!p.departments.includes(j.department)) cell.fill = fill("F3F4F6");   // not their department (hatched on screen)
    });
    const t = row.getCell(TOT);
    t.value = { formula: `SUM(${L(P)}${r}:${L(TOT - 1)}${r})`, result: sum };
    t.numFmt = unitFmt(j.unit); t.font = { bold: true };
    for (let c = 1; c <= TOT; c++) box(row.getCell(c));
    r++;
  }

  const foot = ws.getRow(r);
  foot.getCell(3).value = "Tasks filled";
  people.forEach((p, k) => {
    const c = P + k;
    foot.getCell(c).value = { formula: `COUNT(${L(c)}5:${L(c)}${r - 1})`, result: jobs.filter((j) => val(j, p) != null).length };
    foot.getCell(c).numFmt = `0;-0;"–"`;
  });
  for (let c = 1; c <= TOT; c++) {
    const cell = foot.getCell(c);
    cell.font = { bold: true, color: argb("374151") }; cell.fill = fill("E5E7EB");
    cell.border = { top: { style: "medium", color: argb("9CA3AF") }, left: line, bottom: line, right: line };
    if (c >= P) cell.alignment = { horizontal: "center" };
  }

  const buf = await wb.xlsx.writeBuffer();
  return new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}

// ───────── jobs ─────────
// The rows of the daily sheet, per department: optional machine / type, the job, and the unit it is counted in.
function viewJobs() {
  const v = document.getElementById("view");
  const counts = {};
  data.entries.forEach((e) => { counts[e.job] = (counts[e.job] || 0) + 1; });
  const row = (j = {}) => `<tr data-id="${j.id ?? ""}" data-n="${counts[j.id] || 0}">
    <td><div class="ord"><button type="button" class="icon-btn up" title="Move up" aria-label="Move up">${KPI.ICONS.chevU}</button><button type="button" class="icon-btn dn" title="Move down" aria-label="Move down">${KPI.ICONS.chevD}</button></div></td>
    <td data-label="Machine / type (optional)"><input class="mc" value="${esc(j.machine || "")}" placeholder="—" aria-label="Machine or type (optional)"></td>
    <td data-label="Task"><input class="nm" value="${esc(j.name || "")}" placeholder="Task name" aria-label="Task name"></td>
    <td data-label="Unit"><input class="un" value="${esc(j.unit || "")}" placeholder="pcs" aria-label="Unit"></td>
    <td><button type="button" class="btn danger del">${KPI.ICONS.trash} Remove</button></td></tr>`;
  v.innerHTML = `<p class="hint">These are the rows of the <b>Daily entry</b> sheet, in the same order. <b>Machine / type</b> is optional (RT1, Collator 2 …).
    Each task has its own <b>unit</b>: people are compared with others who did the same task that day, and a department's total on the TV adds up the tasks counted in the department's unit (set in the Departments tab).
    Removing a task hides it; its past counts stay saved, and adding it back with the same name brings them back.</p>
    ${data.departments.map((d) => `<div class="card tcard jobs-card" data-dept="${esc(d.name)}">
      <div class="jobs-h">${dot(d.name)}<b>${esc(d.name)}</b><span class="hint">department total counts <b>${esc(d.unit)}</b></span></div>
      <table class="t job-table"><thead><tr><th style="width:92px">Order</th><th style="width:26%">Machine / type</th><th>Task</th><th style="width:150px">Unit</th><th style="width:110px"></th></tr></thead>
      <tbody>${data.jobs.filter((j) => j.active && j.department === d.name).map(row).join("")}</tbody></table>
      <div class="jobs-add"><button type="button" class="btn add">+ Add task to ${esc(d.name)}</button></div></div>`).join("") || '<p class="hint">Add a department first in the Departments tab.</p>'}
    <div class="savebar"><button class="btn primary" id="save">Save tasks</button><span class="hint" id="chg"></span></div>`;
  const mark = () => { dirty = true; document.getElementById("chg").textContent = "Unsaved changes"; };

  v.querySelectorAll(".jobs-card").forEach((card) => {
    const tb = card.querySelector("tbody");
    card.addEventListener("input", mark);
    const unit = data.deptByName[card.dataset.dept]?.unit || "pcs";
    card.querySelector(".add").onclick = () => { tb.insertAdjacentHTML("beforeend", row({ unit })); tb.lastElementChild.querySelector(".nm").focus(); mark(); };
    tb.addEventListener("click", (e) => {
      const tr = e.target.closest("tr"); if (!tr) return;
      if (e.target.closest(".up") && tr.previousElementSibling) { tb.insertBefore(tr, tr.previousElementSibling); mark(); }
      if (e.target.closest(".dn") && tr.nextElementSibling) { tb.insertBefore(tr.nextElementSibling, tr); mark(); }
      if (e.target.closest(".del")) {
        const n = Number(tr.dataset.n);
        if (n && !confirm(`“${tr.querySelector(".nm").value}” has ${n} count(s) in the last few months. Remove it from the sheet? Its counts stay saved.`)) return;
        tr.remove(); mark();
      }
    });
  });
  document.getElementById("save").onclick = async () => {
    const rows = [];
    for (const card of v.querySelectorAll(".jobs-card")) {
      const seen = new Set();
      for (const tr of card.querySelectorAll("tbody tr")) {
        const r = { id: tr.dataset.id ? Number(tr.dataset.id) : undefined, department: card.dataset.dept, machine: tr.querySelector(".mc").value.trim(), name: tr.querySelector(".nm").value.trim(), unit: tr.querySelector(".un").value.trim() || "pcs" };
        if (!r.name) { tr.querySelector(".nm").focus(); return toast(`${card.dataset.dept}: a task needs a name`, true); }
        const k = (r.machine + "|" + r.name).toLowerCase();
        if (seen.has(k)) return toast(`${card.dataset.dept}: “${KPI.jobLabel(r)}” is listed twice`, true);
        seen.add(k); rows.push(r);
      }
    }
    try { await KPI.saveJobs(rows); await reloadData(); dirty = false; toast("Tasks saved"); viewJobs(); }
    catch (e) { failed(e); }
  };
}

// ───────── departments ─────────
// Name, the unit it counts in, and the order (which also sets the colour on the TV).
function viewDepartments() {
  const v = document.getElementById("view");
  const members = (d) => data.employees.filter((e) => e.departments.includes(d)).map((e) => e.name);
  v.innerHTML = `<p class="hint">Departments group the tasks (Tasks tab) and the people. <b>Unit</b> is what the department's total on the TV counts: it adds up the department's tasks counted in that unit (for example <i>sheets</i>); tasks in other units are shown next to it.
    The order here is the order on the TV screens and sets each department's colour. Renaming keeps its tasks, history and people.
    Removing a department takes it off everyone's list and hides its tasks; their past counts stay saved.</p>
    <div class="card tcard"><table class="t dept-table"><thead><tr><th style="width:92px">Order</th><th>Department</th><th style="width:180px">Total counts</th><th>People</th><th style="width:110px"></th></tr></thead>
    <tbody id="tb">${data.departments.map((d) => row(d.name, d.unit, members(d.name))).join("")}</tbody></table></div>
    <div class="toolbar dept-add" style="margin-top:12px"><input id="newname" placeholder="New department name"><input id="newunit" placeholder="Unit, e.g. sheets" style="width:160px"><button class="btn" id="add">+ Add department</button></div>
    <div class="savebar"><button class="btn primary" id="save">Save departments</button><span class="hint" id="chg"></span></div>`;
  function row(name, unit, people = [], isNew = false) {
    return `<tr data-orig="${isNew ? "" : esc(name)}" data-people="${people.length}">
      <td><div class="ord"><button type="button" class="icon-btn up" title="Move up" aria-label="Move up">${KPI.ICONS.chevU}</button><button type="button" class="icon-btn dn" title="Move down" aria-label="Move down">${KPI.ICONS.chevD}</button></div></td>
      <td data-label="Department"><div class="dname"><span class="swatch"></span><input class="nm" value="${esc(name)}" aria-label="Department name"></div></td>
      <td data-label="Total counts"><input class="un" value="${esc(unit)}" placeholder="pcs" aria-label="Unit"></td>
      <td class="hint" data-label="People">${people.length ? `${people.length} · ${esc(people.join(", "))}` : "—"}</td>
      <td><button type="button" class="btn danger del">${KPI.ICONS.trash} Remove</button></td></tr>`;
  }
  const tb = document.getElementById("tb");
  // colour swatches follow the row order
  const paint = () => [...tb.querySelectorAll("tr")].forEach((tr, i) => { tr.querySelector(".swatch").style.background = `var(--dept-${(i % 8) + 1})`; });
  paint();
  const mark = () => { dirty = true; document.getElementById("chg").textContent = "Unsaved changes"; };
  tb.addEventListener("input", mark);
  tb.addEventListener("click", (e) => {
    const tr = e.target.closest("tr");
    if (e.target.closest(".up") && tr.previousElementSibling) { tr.parentNode.insertBefore(tr, tr.previousElementSibling); paint(); mark(); }
    if (e.target.closest(".dn") && tr.nextElementSibling) { tr.parentNode.insertBefore(tr.nextElementSibling, tr); paint(); mark(); }
    if (e.target.closest(".del")) {
      const n = Number(tr.dataset.people), name = tr.querySelector(".nm").value;
      if (n && !confirm(`${n} ${n === 1 ? "person is" : "people are"} in “${name}”. Remove it from them? Their past counts stay saved.`)) return;
      tr.remove(); paint(); mark();
    }
  });
  document.getElementById("add").onclick = () => {
    const n = document.getElementById("newname").value.trim(), u = document.getElementById("newunit").value.trim() || "pcs";
    if (!n) return document.getElementById("newname").focus();
    tb.insertAdjacentHTML("beforeend", row(n, u, [], true)); paint(); mark();
    document.getElementById("newname").value = ""; document.getElementById("newunit").value = "";
  };
  document.getElementById("save").onclick = async () => {
    const rows = [];
    for (const tr of tb.querySelectorAll("tr")) {
      const name = tr.querySelector(".nm").value.trim(), unit = tr.querySelector(".un").value.trim() || "pcs", orig = tr.dataset.orig;
      if (!name) return toast("A department needs a name", true);
      if (name.includes(",")) return toast(`“${name}”: department names can't contain commas`, true);
      if (rows.some((r) => r.name.toLowerCase() === name.toLowerCase())) return toast(`Two departments are called “${name}”`, true);
      rows.push({ name, unit, renamedFrom: orig && orig !== name ? orig : undefined });
    }
    try { await KPI.saveDepartments(rows); await reloadData(); dirty = false; toast("Departments saved"); viewDepartments(); }
    catch (e) { failed(e); }
  };
}

// ───────── employees ─────────
function viewEmployees() {
  const v = document.getElementById("view");
  const depts = deptNames();
  const photos = new WeakMap(); // <tr> -> photo data URL
  const row = (e) => {
    const opts = [...new Set([...depts, ...e.departments])];
    return `<tr data-orig="${esc(e.name)}">
    <td><div class="ph">
      <label class="ph-av" title="Upload photo">${KPI.avatar(e, { size: "48px" })}<span class="ph-cam">${KPI.ICONS.camera}</span><input type="file" accept="image/*" class="ph-in"></label>
      <div class="ph-act"><label class="linkbtn">Upload<input type="file" accept="image/*" class="ph-in"></label><button type="button" class="linkbtn danger ph-rm" ${e.photo ? "" : "hidden"}>Remove</button></div>
    </div></td>
    <td data-label="Name"><input class="nm" value="${esc(e.name)}" style="width:160px" aria-label="Name"></td>
    <td data-label="Main department"><select class="dp" title="Main department" aria-label="Main department">${e.department ? "" : '<option value="">— choose —</option>'}${opts.map((d) => `<option ${d === e.department ? "selected" : ""}>${esc(d)}</option>`).join("")}</select></td>
    <td data-label="Also works in"><div class="chips also-chips">${opts.map((d) => { const on = e.departments.slice(1).includes(d); return `<label class="chip ${on ? "on" : ""}" ${d === e.department ? "hidden" : ""}><input type="checkbox" class="dp2" value="${esc(d)}" ${on ? "checked" : ""}>${esc(d)}</label>`; }).join("")}</div></td>
    <td><label class="hint"><input type="checkbox" class="ac" ${e.active ? "checked" : ""}> Show</label></td></tr>`;
  };
  v.innerHTML = `<p class="hint">Click a picture (or <b>Upload</b>) to add a profile photo — it is cropped to a square and compressed automatically. Pick each person's <b>main department</b> and tick any others they also work in: that decides where they appear on the TV, and which rows of Daily entry are shaded for them. Untick <b>Show</b> to hide someone from the TV without deleting their history. Renaming keeps past counts linked.</p>
    <div class="card tcard"><table class="t emp-table"><thead><tr><th>Photo</th><th>Name</th><th>Main department</th><th>Also works in</th><th>TV</th></tr></thead><tbody id="tb">${data.employees.map(row).join("")}</tbody></table></div>
    <div class="toolbar" style="margin-top:12px"><button class="btn" id="add">+ Add employee</button><span class="hint">Add or rename departments in the Departments tab.</span></div>
    <div class="savebar"><button class="btn primary" id="save">Save employees</button></div>`;
  const tb = document.getElementById("tb");
  tb.querySelectorAll("tr").forEach((tr, i) => photos.set(tr, data.employees[i]?.photo || ""));
  const paintAvatar = (tr) => {
    const name = tr.querySelector(".nm").value.trim() || "?";
    const tmp = { name, department: tr.querySelector(".dp").value, photo: photos.get(tr) || "" };
    tr.querySelector(".ph-av .av").outerHTML = KPI.avatar(tmp, { size: "48px" });
    tr.querySelector(".ph-rm").hidden = !tmp.photo;
  };
  tb.addEventListener("change", async (e) => {
    dirty = true;
    if (e.target.closest(".chip")) e.target.closest(".chip").classList.toggle("on", e.target.checked);
    const tr = e.target.closest("tr");
    if (e.target.classList.contains("ph-in") && e.target.files[0]) {
      try { photos.set(tr, await KPI.resizePhoto(e.target.files[0])); paintAvatar(tr); toast("Photo added — click Save employees to keep it"); }
      catch (ex) { toast(ex.message, true); }
      e.target.value = "";
    }
    if (e.target.classList.contains("dp")) {
      // the main department can't also be an extra one
      tr.querySelectorAll(".dp2").forEach((c) => { const main = c.value === e.target.value; c.closest(".chip").hidden = main; if (main) { c.checked = false; c.closest(".chip").classList.remove("on"); } });
      paintAvatar(tr);
    }
  });
  tb.addEventListener("click", (e) => {
    if (e.target.classList.contains("ph-rm")) { const tr = e.target.closest("tr"); photos.set(tr, ""); paintAvatar(tr); dirty = true; }
  });
  tb.addEventListener("focusout", (e) => { if (e.target.classList.contains("nm")) paintAvatar(e.target.closest("tr")); });
  tb.addEventListener("input", () => (dirty = true));
  document.getElementById("add").onclick = () => {
    tb.insertAdjacentHTML("beforeend", row({ name: "", department: depts[0] || "", departments: depts[0] ? [depts[0]] : [], active: true, photo: "" }));
    photos.set(tb.lastElementChild, ""); tb.lastElementChild.dataset.orig = ""; tb.lastElementChild.querySelector(".nm").focus(); dirty = true;
  };
  document.getElementById("save").onclick = async () => {
    const list = [];
    for (const tr of tb.querySelectorAll("tr")) {
      const name = tr.querySelector(".nm").value.trim();
      if (!name) continue;
      if (list.some((x) => x.name.toLowerCase() === name.toLowerCase())) { toast(`Duplicate name: ${name}`, true); return; }
      const orig = tr.dataset.orig;
      const main = tr.querySelector(".dp").value;
      const department = [main, ...[...tr.querySelectorAll(".dp2:checked")].map((i) => i.value)].filter((d, i, a) => d && a.indexOf(d) === i).join(", ");
      list.push({ name, department, active: tr.querySelector(".ac").checked, photo: photos.get(tr) || "", renamedFrom: orig && orig !== name ? orig : undefined });
    }
    try { await KPI.saveEmployees(list); await reloadData(); dirty = false; toast("Employees saved"); viewEmployees(); }
    catch (e) { failed(e); }
  };
}
