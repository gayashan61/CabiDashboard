<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="assets/core.js"></script>
<script>
const { CFG, esc, fmtNum } = KPI;
const app = document.getElementById("app");
let data = null;
let tab = "entry";
let entryDay = KPI.todayKey();
let deptFilter = "";
let onlyMembers = true;  // with a department chosen: only its people as columns
let tasksDept = "";      // Tasks tab: the department whose tasks are shown
let entryEdits = {};     // daily entry: "jobId|name" ➜ typed text, until saved
let dirty = false;
// Phones and tablets get the entry as cards (one per task) instead of the wide sheet
const NARROW = matchMedia("(max-width: 1023px)");
NARROW.addEventListener("change", () => { if (data && tab === "entry" && document.getElementById("view")) viewEntry(); });
const cardOpen = {};           // task id ➜ its entry card is open (remembered while switching tabs / days)
const othersOpen = new Set();  // task ids whose card also lists people from other departments
// Close an open ⋯ menu when tapping elsewhere or pressing Esc
document.addEventListener("click", (e) => { document.querySelectorAll("details.appmenu[open], details.more-menu[open]").forEach((d) => { if (!d.contains(e.target)) d.open = false; }); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.querySelectorAll("details.appmenu[open], details.more-menu[open]").forEach((d) => (d.open = false)); });

function toast(msg, error) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast show" + (error ? " error" : "");
  clearTimeout(t._h); t._h = setTimeout(() => (t.className = "toast"), Math.max(2600, msg.length * 70));
}
window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

const themeBtn = () => `<button class="icon-btn theme-toggle" id="theme-btn" title="Switch light / dark theme" aria-label="Switch light or dark theme">${KPI.ICONS.moon}${KPI.ICONS.sun}</button>`;
const bindTheme = () => { const b = document.getElementById("theme-btn"); if (b) b.onclick = () => KPITheme.toggle(); };

// ───────── sign-in ─────────
// Signing in happens on the start page (index.html); this page is for admins only.
function logout() { KPI.logout().then(() => location.replace("index.html")); }
const failed = (e) => { toast("Save failed: " + e.message, true); if (KPI.isAuthProblem(e.message)) setTimeout(KPI.goSignIn, 1500); };

// Admin-only data next to `data`: logins, TV accounts, task lists and submissions (admin_data())
let admin = { logins: {}, viewers: [], assignments: [], submissions: [] };
const tasksOf = (name) => admin.assignments.filter(([e]) => e === name).map(([, j]) => Number(j));
async function reloadData() {
  const [d, a] = await Promise.all([KPI.load(120), KPI.adminData()]);
  data = d;
  admin = { ...a, submissions: (a.submissions || []).map((s) => ({ ...s, qty: Number(s.qty), final_qty: s.final_qty == null ? null : Number(s.final_qty) })) };
}
async function boot() {
  const w = await KPI.resume();
  if (!w) return KPI.goSignIn();
  if (!w.admin) return location.replace(w.employee ? "me.html" : "index.html");
  app.innerHTML = `<div class="wrap"><p class="hint">Loading…</p></div>`;
  try { await reloadData(); }
  catch (e) { app.innerHTML = `<div class="wrap"><p class="err">Could not load data: ${esc(e.message)}</p><p class="hint">Check that supabase/schema.sql has been run (README ➜ Logins and approvals).</p></div>`; return; }
  shell();
  startInbox();
  // On the Android app: push notifications; tapping one about a count opens the approvals
  KPI.setupPush((d) => { if (d.kind === "submission") { tab = "entry"; renderTab(); document.getElementById("appr")?.scrollIntoView(); } });
}

// ───────── notifications and the pending badge ─────────
// Checks every 30 s (and when a push arrives): new submissions refresh the approvals list without touching typed values.
let lastInbox = null;
function paintBadges(i) {
  const b = document.getElementById("bell-n"), p = document.getElementById("pend-n");
  if (b) { b.hidden = !i.unread; b.textContent = i.unread > 99 ? "99+" : i.unread; }
  if (p) { p.hidden = !i.pending; p.textContent = i.pending; }
}
function startInbox() {
  const tick = async () => {
    try {
      const i = await KPI.inbox();
      paintBadges(i);
      if (lastInbox && (i.pending !== lastInbox.pending || i.latest !== lastInbox.latest)) {
        const a = await KPI.adminData();
        admin = { ...a, submissions: (a.submissions || []).map((s) => ({ ...s, qty: Number(s.qty), final_qty: s.final_qty == null ? null : Number(s.final_qty) })) };
        if (tab === "entry") renderApprovals();
      }
      lastInbox = i;
    } catch (e) { if (KPI.isAuthProblem(e.message)) KPI.goSignIn(); }
  };
  tick();
  setInterval(tick, 30000);
  window.addEventListener("kpi:notification", tick);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
}
const ago = (t) => {
  const m = Math.round((Date.now() - new Date(t)) / 60000);
  return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : KPI.fmtDate(KPI.dayKey(new Date(t)));
};
async function openBell() {
  const pop = document.getElementById("bell-pop");
  if (!pop.hidden) { pop.hidden = true; return; }
  pop.hidden = false;
  pop.innerHTML = `<div class="who">Loading…</div>`;
  try {
    const list = await KPI.notifications(30);
    pop.innerHTML = list.length ? list.map((n) => `<button type="button" class="nt ${n.read ? "" : "new"}" data-kind="${esc(n.kind)}">
        <b>${esc(n.title)}</b><span>${esc(n.body)}</span><small>${esc(ago(n.created_at))}</small></button>`).join("")
      : `<div class="who">No notifications yet</div>`;
    if (list.some((n) => !n.read)) { await KPI.readNotifications(); paintBadges({ ...(lastInbox || {}), unread: 0 }); }
  } catch (e) { pop.innerHTML = `<div class="who">${esc(e.message)}</div>`; }
}

function shell() {
  app.innerHTML = `
    <div class="appbar"><div class="appbar-in">
      <div class="brand"><div class="brand-mark">${KPI.LOGO}</div><div class="brand-text"><div class="brand-eyebrow">${esc(CFG.APP_NAME)}</div><div class="brand-title">Admin console</div></div></div>
      <span class="sp"></span>
      ${KPI.signedInAs() ? `<span class="hint who-inline">${esc(KPI.signedInAs())}</span>` : ""}
      <nav class="screens" aria-label="TV screens">
        <a class="btn" href="tv-slides.html" title="Slideshow">${KPI.ICONS.play}<span>Slideshow</span></a>
        <a class="btn" href="tv-grid.html" title="Team grid">${KPI.ICONS.grid}<span>Team grid</span></a>
        <a class="btn" href="tv-departments.html" title="Departments">${KPI.ICONS.list}<span>Departments</span></a>
      </nav>
      <details class="appmenu"><summary class="icon-btn" aria-label="Menu: TV screens and account" title="Menu">${KPI.ICONS.more}</summary>
        <div class="menu-pop">
          ${KPI.signedInAs() ? `<div class="who">Signed in as<br><b>${esc(KPI.signedInAs())}</b></div>` : ""}
          <a href="tv-slides.html">${KPI.ICONS.play}Slideshow</a><a href="tv-grid.html">${KPI.ICONS.grid}Team grid</a><a href="tv-departments.html">${KPI.ICONS.list}Departments</a>
        </div></details>
      <div class="bellwrap"><button class="icon-btn" id="bell" title="Notifications" aria-label="Notifications">${KPI.ICONS.bell}<span class="badge" id="bell-n" hidden></span></button>
        <div class="menu-pop bell-pop" id="bell-pop" hidden></div></div>
      ${themeBtn()}
      <button class="icon-btn" id="lo" title="Log out" aria-label="Log out">${KPI.ICONS.logout}</button>
    </div></div>
    <div class="wrap" id="wrap">
    <div class="page-h"><div><h1>Production data</h1><p>Record and approve each person's daily counts, and manage tasks, departments, people and logins.</p></div></div>
    <nav class="tabs">
      <button data-t="entry">Daily entry<span class="tbadge" id="pend-n" title="Counts waiting for approval" hidden></span></button><button data-t="jobs">Tasks</button><button data-t="departments">Departments</button><button data-t="employees">Employees</button>
    </nav>
    <div id="view"></div></div>`;
  document.getElementById("lo").onclick = () => logout();
  document.getElementById("bell").onclick = (e) => { e.stopPropagation(); openBell(); };
  document.addEventListener("click", (e) => { const pop = document.getElementById("bell-pop"); if (pop && !pop.hidden && !e.target.closest(".bellwrap")) pop.hidden = true; });
  bindTheme();
  app.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
    if (dirty && !confirm("You have unsaved changes. Leave this tab?")) return;
    dirty = false; entryEdits = {}; tab = b.dataset.t; renderTab();
  });
  if (lastInbox) paintBadges(lastInbox);
  renderTab();
}
function renderTab() {
  app.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.t === tab));
  document.onkeydown = null;
  document.getElementById("wrap").classList.toggle("wide", tab === "entry"); // the sheet uses the full width
  ({ entry: viewEntry, jobs: viewJobs, departments: viewDepartments, employees: viewEmployees })[tab]();
}
const deptNames = () => KPI.deptNames(data);
const dot = (d) => `<span class="dept-dot" style="background:${KPI.deptColor(d)}"></span>`;

// ───────── daily entry ─────────
// Laid out like the client's Excel sheet: jobs down the side (grouped by department), people across the top.
// Typed values live in entryEdits until saved, so changing the department filter never loses them.
function viewEntry() {
  const v = document.getElementById("view");
  const depts = deptNames();
  const key = (id, name) => id + "|" + name;
  const saved = {};
  // Counts employees sent for this day that wait for approval: shown as hints in their boxes
  const pend = {};
  admin.submissions.forEach((x) => { if (x.status === "pending" && x.date === entryDay) pend[key(x.job, x.employee)] = x; });
  const pendAttrs = (k) => pend[k] ? ` class="pend" placeholder="${KPI.fmtFull(pend[k].qty)}" title="${esc(pend[k].employee)} sent ${KPI.fmtFull(pend[k].qty)} — waiting for approval (type it to approve)"` : "";
  data.entries.forEach((e) => { if (e.date === entryDay) saved[key(e.job, e.employee)] = e.qty; });
  const text = (k) => (k in entryEdits ? entryEdits[k] : String(saved[k] ?? ""));
  const used = (id) => Object.keys(saved).some((k) => k.startsWith(id + "|")) || Object.keys(entryEdits).some((k) => k.startsWith(id + "|"));
  // Boxes with a count that day, in one department ("" = all) — shown on its tab
  const filled = (d) => [...new Set([...Object.keys(saved), ...Object.keys(entryEdits)])]
    .filter((k) => KPI.parseQty(text(k)) > 0 && (!d || data.jobById[k.slice(0, k.indexOf("|"))]?.department === d)).length;
  // Removed jobs only appear if they have a count that day (so it can still be corrected)
  const jobs = data.jobs.filter((j) => (!deptFilter || j.department === deptFilter) && ((j.active && depts.includes(j.department)) || used(j.id)));
  const people = data.employees.filter((e) => {
    const has = jobs.some((j) => text(key(j.id, e.name)) !== "");
    if (!e.active && !has) return false;
    return !deptFilter || !onlyMembers || e.departments.includes(deptFilter) || has;
  });
  const narrow = NARROW.matches;
  const cols = people.length + 3;
  let rows = "", last = null;
  if (!narrow) jobs.forEach((j) => {
    if (j.department !== last) {
      last = j.department;
      rows += `<tr class="g"><th colspan="${cols}"><span>${dot(j.department)}${esc(j.department || "No department")}</span></th></tr>`;
    }
    rows += `<tr data-job="${j.id}" data-unit="${esc(j.unit)}"><th class="c-job" title="${esc(j.department + " · " + KPI.jobLabel(j))}">${j.machine ? `<span class="m">${esc(j.machine)}</span>` : ""}${esc(j.name)}${j.active ? "" : ' <span class="m">(removed)</span>'}</th><td class="c-unit">${esc(j.unit)}</td>
      ${people.map((e, c) => `<td class="cell${e.departments.includes(j.department) ? "" : " off"}"><input inputmode="decimal" data-c="${c}" data-emp="${esc(e.name)}" value="${esc(text(key(j.id, e.name)))}"${pendAttrs(key(j.id, e.name))} aria-label="${esc(e.name)} — ${esc(KPI.jobLabel(j))}"></td>`).join("")}
      <td class="c-tot"></td></tr>`;
  });
  // Phones / tablets: one card per task; inside, the department's own people first, then (on request) everyone else
  let cards = "";
  if (narrow) {
    const everyone = data.employees.filter((e) => e.active || jobs.some((j) => text(key(j.id, e.name)) !== ""));
    const row = (e, j) => `<label class="ec-r">${KPI.avatar(e, { cls: "sm" })}<span class="ec-nm">${esc(e.name)}${e.departments.includes(j.department) ? "" : `<small>${esc(e.departments.join(", ") || "No department")}</small>`}</span>
      <input inputmode="decimal" enterkeyhint="next" autocomplete="off" data-emp="${esc(e.name)}" value="${esc(text(key(j.id, e.name)))}"${pendAttrs(key(j.id, e.name)) || ` placeholder="${esc(j.unit)}"`} aria-label="${esc(e.name)} — ${esc(KPI.jobLabel(j))}"></label>`;
    let lastD = null;
    jobs.forEach((j) => {
      if (!deptFilter && j.department !== lastD) { lastD = j.department; cards += `<h3 class="ec-dept">${dot(j.department)}${esc(j.department || "No department")}</h3>`; }
      const mine = everyone.filter((e) => e.departments.includes(j.department)), others = everyone.filter((e) => !e.departments.includes(j.department));
      const has = everyone.some((e) => text(key(j.id, e.name)) !== "");
      const open = cardOpen[j.id] ?? (has || jobs.length === 1);
      const showOthers = !mine.length || othersOpen.has(j.id) || others.some((e) => text(key(j.id, e.name)) !== "");
      cards += `<section class="ec-card ${open ? "open" : ""}" data-job="${j.id}" data-unit="${esc(j.unit)}">
        <button type="button" class="ec-h" aria-expanded="${open}" aria-controls="ecb-${j.id}">
          <span class="ec-t">${j.machine ? `<span class="m">${esc(j.machine)}</span>` : ""}${esc(j.name)}${j.active ? "" : " (removed)"}<small>${esc(j.unit)}</small></span>
          <span class="ec-s"><b class="c-tot"></b><small class="ec-n"></small></span>${KPI.ICONS.chevD}</button>
        <div class="ec-b" id="ecb-${j.id}" ${open ? "" : "hidden"}>${mine.map((e) => row(e, j)).join("")}
          ${others.length ? `${showOthers ? "" : `<button type="button" class="ec-more">+ ${others.length} ${others.length === 1 ? "person" : "people"} from other departments</button>`}
          <div class="ec-others" ${showOthers ? "" : "hidden"}>${others.map((e) => row(e, j)).join("")}</div>` : ""}
        </div></section>`;
    });
  }
  v.innerHTML = `
    <div class="toolbar">
      <button class="btn" id="prev" title="Previous day">◀</button>
      <input type="date" id="day" value="${entryDay}" max="${KPI.todayKey()}">
      <button class="btn" id="next" title="Next day">▶</button>
      <button class="btn" id="today">Today</button>
      <span class="datebig">${esc(KPI.fmtDate(entryDay, { weekday: "long", day: "numeric", month: "long", year: "numeric" }))}</span>
      <span class="sp"></span>
      <button class="btn" id="export" title="Download this day as a formatted Excel file (all departments)">${KPI.ICONS.download} Export Excel</button>
      <details class="more-menu"><summary class="icon-btn" aria-label="More actions" title="More">${KPI.ICONS.more}</summary>
        <div class="menu-pop"><button type="button" id="export-m">${KPI.ICONS.download}Export Excel</button></div></details>
    </div>
    <div class="toolbar">
      <nav class="dtabs" aria-label="Department">${["", ...depts].map((d) => {
        const n = filled(d);
        return `<button type="button" data-d="${esc(d)}" class="${d === deptFilter ? "on" : ""}" aria-pressed="${d === deptFilter}">${d ? dot(d) + esc(d) : "All departments"}${n ? `<span class="n" title="${n} count(s) filled in">${n}</span>` : ""}</button>`;
      }).join("")}</nav>
      <span class="sp"></span>
      ${deptFilter ? `<label class="hint"><input type="checkbox" id="members" ${onlyMembers ? "checked" : ""}> Only people in ${esc(deptFilter)}</label>` : ""}
    </div>
    <section class="appr" id="appr" hidden></section>
    <p class="hint hint-d">Type each person's count in the row of the task they did, like the Excel sheet. Sums like <b>1500+250</b> work; leave blank for none.
      <b>Enter</b> / arrow keys move between boxes, <b>Ctrl+S</b> saves. Shaded boxes = the person isn't in that department (you can still fill them).<br>
      <b>From Excel:</b> copy the day's sheet from the <i>Dept</i> / names row down, click any box and paste — every count lands in the right place.</p>
    <p class="hint hint-m">Tap a task, then type each person's count. Sums like <b>1500+250</b> work; leave blank for none.</p>
    ${narrow ? (cards ? `<div class="ec" id="ec">${cards}</div>` : `<p class="hint">No tasks yet — add them in the Tasks tab.</p>`)
    : jobs.length && people.length ? `<div class="eg-wrap"><table class="eg" id="eg">
      <thead><tr><th class="c-job">Task</th><th class="c-unit">Unit</th>${people.map((e) => `<th class="c-p" title="${esc(e.departments.join(", "))}">${esc(e.name)}</th>`).join("")}<th class="c-tot">Total</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><th class="c-job">Tasks filled</th><td class="c-unit"></td>${people.map(() => "<td></td>").join("")}<td class="c-tot"></td></tr></tfoot>
    </table></div>` : `<p class="hint">${jobs.length ? "No active employees — add them in the Employees tab." : "No tasks yet — add them in the Tasks tab."}</p>`}
    <div class="savebar"><button class="btn primary" id="save" disabled>Save changes</button><span class="hint" id="chg">No changes</span></div>`;

  const setDay = (d) => { if (dirty && !confirm("Discard unsaved changes?")) return; dirty = false; entryEdits = {}; entryDay = d > KPI.todayKey() ? KPI.todayKey() : d; viewEntry(); };
  document.getElementById("day").onchange = (e) => e.target.value && setDay(e.target.value);
  document.getElementById("prev").onclick = () => setDay(KPI.addDays(entryDay, -1));
  document.getElementById("next").onclick = () => setDay(KPI.addDays(entryDay, 1));
  document.getElementById("next").disabled = entryDay >= KPI.todayKey();
  document.getElementById("today").onclick = () => setDay(KPI.todayKey());
  v.querySelector(".dtabs").onclick = (e) => { const b = e.target.closest("[data-d]"); if (b) { deptFilter = b.dataset.d; viewEntry(); } };
  if (narrow) v.querySelector(".dtabs .on")?.scrollIntoView({ block: "nearest", inline: "center" }); // the chosen chip stays in view
  renderApprovals();
  const mem = document.getElementById("members");
  if (mem) mem.onchange = () => { onlyMembers = mem.checked; viewEntry(); };

  // Excel export of the whole day (every department, whatever tab is open), laid out like the sheet:
  // Dept / Machine / Task / Unit, then one column per person, row totals and "Tasks filled".
  // The file can be pasted back in: its names row and task columns match what paste expects.
  document.getElementById("export-m").onclick = (e) => { e.target.closest("details").open = false; doExport(); };
  document.getElementById("export").onclick = doExport;
  async function doExport() {
    const btn = document.getElementById("export");
    if (Object.values(entryEdits).some((t) => Number.isNaN(KPI.parseQty(t)))) return toast("Fix the red boxes first — use numbers only", true);
    btn.disabled = true;
    try {
      await loadScript("https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js", "ExcelJS");
      const allJobs = data.jobs.filter((j) => (j.active && depts.includes(j.department)) || used(j.id));
      const cols = data.employees.filter((e) => e.active || allJobs.some((j) => KPI.parseQty(text(key(j.id, e.name))) > 0));
      const unsaved = changes().out.length;
      const blob = await dayWorkbook(entryDay, allJobs, cols, (j, e) => KPI.parseQty(text(key(j.id, e.name))) || null);
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = `Production ${entryDay}.xlsx`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      toast(`Downloaded ${a.download}${unsaved ? " — includes your unsaved changes" : ""}`);
    } catch (e) { toast("Export failed: " + e.message, true); }
    btn.disabled = false;
  }

  // What changed compared with what is saved (all edits, including rows hidden by the filter)
  const changes = () => {
    const out = [], bad = [];
    for (const [k, t] of Object.entries(entryEdits)) {
      const q = KPI.parseQty(t);
      if (Number.isNaN(q)) { bad.push(k); continue; }
      if ((q || null) !== (saved[k] || null)) { const i = k.indexOf("|"); out.push({ job: Number(k.slice(0, i)), employee: k.slice(i + 1), qty: q || null }); }
    }
    return { out, bad };
  };
  const eg = document.getElementById("eg"), ec = document.getElementById("ec");
  const box = eg || ec; // the sheet (wide screens) or the cards (phones / tablets)
  const paintCell = (i) => {
    const k = key(i.closest("[data-job]").dataset.job, i.dataset.emp);
    const q = KPI.parseQty(i.value);
    i.classList.toggle("bad", Number.isNaN(q));
    i.classList.toggle("changed", !Number.isNaN(q) && (q || null) !== (saved[k] || null));
  };
  const paintTotals = () => {
    if (!box) return;
    box.querySelectorAll("[data-job]").forEach((row) => {
      const qs = [...row.querySelectorAll("input")].map((i) => KPI.parseQty(i.value) || 0);
      const sum = qs.reduce((a, b) => a + b, 0), n = qs.filter(Boolean).length;
      row.querySelector(".c-tot").textContent = sum ? `${KPI.fmtFull(sum)} ${row.dataset.unit}` : ec ? "–" : "";
      const who = row.querySelector(".ec-n");
      if (who) who.textContent = n ? `${n} ${n === 1 ? "person" : "people"}` : "no counts";
    });
    if (!eg) return;
    const foot = eg.querySelectorAll("tfoot td");
    people.forEach((e, c) => {
      const n = eg.querySelectorAll(`tbody input[data-c="${c}"]`);
      const filled = [...n].filter((i) => KPI.parseQty(i.value)).length;
      foot[c + 1].textContent = filled || "–";
      foot[c + 1].classList.toggle("none", !filled);
    });
  };
  const refresh = () => {
    v.querySelectorAll(".dtabs [data-d]").forEach((b) => {
      const n = filled(b.dataset.d);
      let s = b.querySelector(".n");
      if (!n) return s?.remove();
      if (!s) { s = document.createElement("span"); s.className = "n"; b.appendChild(s); }
      s.textContent = n; s.title = `${n} count(s) filled in`;
    });
    const { out, bad } = changes();
    dirty = out.length > 0 || bad.length > 0;
    document.getElementById("save").disabled = !out.length || bad.length > 0;
    document.getElementById("chg").textContent = bad.length ? `${bad.length} invalid value(s) — use numbers only` : out.length ? `${out.length} unsaved change(s)` : "No changes";
  };
  const edit = (i, value) => {
    if (value != null) i.value = value;
    entryEdits[key(i.closest("[data-job]").dataset.job, i.dataset.emp)] = i.value;
    paintCell(i);
  };
  const revert = (i) => { edit(i, String(saved[key(i.closest("[data-job]").dataset.job, i.dataset.emp)] ?? "")); paintTotals(); refresh(); i.select(); };
  if (box) {
    box.querySelectorAll("input").forEach(paintCell);
    paintTotals();
    box.addEventListener("input", (e) => { if (!e.target.matches("input")) return; edit(e.target); paintTotals(); refresh(); });
    box.addEventListener("paste", onPaste);
  }
  if (ec) {
    // Tap a task to open / close it; "+ N people from other departments" shows the rest
    ec.addEventListener("click", (e) => {
      const h = e.target.closest(".ec-h");
      if (h) {
        const card = h.closest(".ec-card"), open = !card.classList.contains("open");
        cardOpen[card.dataset.job] = open;
        card.classList.toggle("open", open); h.setAttribute("aria-expanded", open);
        card.querySelector(".ec-b").hidden = !open;
      }
      const more = e.target.closest(".ec-more");
      if (more) { othersOpen.add(Number(more.closest(".ec-card").dataset.job)); more.nextElementSibling.hidden = false; more.remove(); }
    });
    // The keyboard's Next / Enter goes to the next person's box; Esc puts back the saved value
    ec.addEventListener("keydown", (e) => {
      const i = e.target.closest("input"); if (!i) return;
      if (e.key === "Escape") return revert(i);
      if (e.key !== "Enter") return;
      e.preventDefault();
      const all = [...ec.querySelectorAll("input")].filter((x) => x.offsetParent);
      const next = all[all.indexOf(i) + 1];
      if (next) { next.focus(); next.select(); } else i.blur();
    });
    ec.addEventListener("focusin", (e) => { if (e.target.matches("input")) e.target.select(); });
  }
  if (eg) {

    // Keyboard: Enter / ↑ ↓ move up and down, ← → move sideways at the edge of the text (like Excel)
    const bodyRows = () => [...eg.querySelectorAll("tbody tr[data-job]")];
    const cellAt = (tr, c) => tr?.querySelector(`input[data-c="${c}"]`);
    const go = (i) => { if (i) { i.focus(); i.select(); } };
    eg.addEventListener("keydown", (e) => {
      const i = e.target.closest("input"); if (!i) return;
      const rs = bodyRows(), r = rs.indexOf(i.closest("tr")), c = Number(i.dataset.c);
      const all = i.selectionStart === 0 && i.selectionEnd === i.value.length;
      if (e.key === "Enter" || e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        go(cellAt(rs[r + (e.key === "ArrowUp" || (e.key === "Enter" && e.shiftKey) ? -1 : 1)], c));
      } else if (e.key === "ArrowRight" && (all || i.selectionStart === i.value.length)) { e.preventDefault(); go(cellAt(rs[r], c + 1)); }
      else if (e.key === "ArrowLeft" && (all || i.selectionEnd === 0)) { e.preventDefault(); go(cellAt(rs[r], c - 1)); }
      else if (e.key === "Escape") revert(i);
    });
    // Highlight the row and the person's column of the box being typed in
    eg.addEventListener("focusin", (e) => {
      const i = e.target.closest("input"); if (!i) return;
      eg.querySelectorAll(".hl").forEach((x) => x.classList.remove("hl"));
      i.closest("tr").querySelector(".c-job").classList.add("hl");
      eg.querySelectorAll("thead th.c-p")[Number(i.dataset.c)]?.classList.add("hl");
      i.select();
    });

  }
  // Paste from Excel: a whole sheet (with the names row) goes by name and task; on the sheet,
  // any other block fills the boxes from the one pasted into.
  function onPaste(e) {
    const i = e.target.closest("input"); if (!i) return;
    const txt = (e.clipboardData || window.clipboardData).getData("text");
    if (!/[\t\n]/.test(txt.replace(/\r?\n$/, ""))) return; // a single value: normal paste
    e.preventDefault();
    const grid = txt.replace(/\r/g, "").replace(/\n$/, "").split("\n").map((r) => r.split("\t"));
    const names = new Map(data.employees.map((x) => [x.name.toLowerCase(), x.name]));
    const h = grid.findIndex((r) => r.filter((c) => names.has(c.trim().toLowerCase())).length >= 2);
    if (h >= 0) return pasteSheet(grid, h, names);
    if (!eg) return toast("To paste from Excel, copy the whole day's sheet including the names row", true);
    const rs = [...eg.querySelectorAll("tbody tr[data-job]")], r0 = rs.indexOf(i.closest("tr")), c0 = Number(i.dataset.c);
    let n = 0;
    grid.forEach((row, dr) => row.forEach((val, dc) => { const t = rs[r0 + dr]?.querySelector(`input[data-c="${c0 + dc}"]`); if (t) { edit(t, val.trim()); n++; } }));
    paintTotals(); refresh();
    toast(`Pasted ${n} box${n === 1 ? "" : "es"}`);
  }
  // A copied day sheet: columns matched by name, rows by department + machine/unit + job.
  function pasteSheet(grid, h, names) {
    const colName = grid[h].map((c) => names.get(c.trim().toLowerCase()) || null);
    const unknown = grid[h].map((c, idx) => (idx > 2 && c.trim() && !colName[idx] && grid.slice(h + 1).some((r) => (r[idx] || "").trim()) ? c.trim() : null)).filter(Boolean);
    const lc = (s) => String(s || "").trim().toLowerCase();
    const findJob = (dept, b, c) => {
      const cands = data.jobs.filter((j) => lc(j.name) === lc(c));
      const inDept = cands.filter((j) => lc(j.department) === lc(dept));
      const pool = inDept.length ? inDept : cands;
      const score = (j) => (b && lc(j.machine) === lc(b) ? 4 : 0) + (b && lc(j.unit) === lc(b) ? 2 : 0) + (!b && !j.machine ? 1 : 0) + (j.active ? 1 : 0);
      return pool.sort((x, y) => score(y) - score(x))[0] || null;
    };
    let dept = "", n = 0;
    const missing = [];
    for (const row of grid.slice(h + 1)) {
      const [a, b, c] = [0, 1, 2].map((x) => (row[x] || "").trim());
      if (a) dept = a;
      const hasVals = colName.some((nm, idx) => nm && (row[idx] || "").trim());
      if (!c) { if (hasVals) missing.push([a, b].filter(Boolean).join(" ") || "a row without a task name"); continue; }
      const job = findJob(dept, b, c);
      if (!job) { if (hasVals) missing.push([dept, b, c].filter(Boolean).join(" ")); continue; }
      colName.forEach((nm, idx) => {
        if (!nm) return;
        const k = key(job.id, nm), val = (row[idx] || "").trim();
        if (val === text(k)) return;
        entryEdits[k] = val; if (val) n++;
      });
    }
    viewEntry();
    const warn = [missing.length && `rows not found in Tasks: ${missing.join(", ")}`, unknown.length && `not in Employees: ${unknown.join(", ")}`].filter(Boolean).join(" · ");
    toast(`Pasted the sheet — ${n} count${n === 1 ? "" : "s"} filled in. Check and click Save.${warn ? " Skipped " + warn : ""}`, !!warn);
  }
  refresh();

  const save = async () => {
    const { out, bad } = changes();
    if (!out.length || bad.length) return;
    const btn = document.getElementById("save"); btn.disabled = true; btn.textContent = "Saving…";
    try {
      await KPI.saveEntries(entryDay, out);
      await reloadData(); dirty = false; entryEdits = {};
      toast(`Saved ${out.length} count(s) for ${KPI.fmtDate(entryDay)}`); viewEntry();
    } catch (e) { btn.disabled = false; btn.textContent = "Save changes"; failed(e); }
  };
  document.getElementById("save").onclick = save;
  document.onkeydown = (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); save(); } };
}

// Loads a library from the CDN the first time it's needed.
function loadScript(src, globalName) {
  if (window[globalName]) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = () => res();
    s.onerror = () => { s.remove(); rej(new Error("could not load the Excel library — check the internet connection")); };
    document.head.appendChild(s);
  });
}

// Department colours of the light theme (--dept-1 … --dept-8 in assets/style.css), for a white Excel sheet.
const XL_DEPT = ["2A78D6", "1BAF7A", "4A3AA7", "E87BA4", "EB6834", "008300", "EDA100", "E34948"];
// One day as a formatted .xlsx Blob. val(job, person) = the count or null.
async function dayWorkbook(day, jobs, people, val) {
  const [y, m, d] = day.split("-").map(Number);
  const wb = new ExcelJS.Workbook();
  wb.creator = `${CFG.APP_NAME} · ${CFG.COMPANY_NAME}`;
  const ws = wb.addWorksheet(`${d}-${m}-${y}`, {
    views: [{ state: "frozen", xSplit: 4, ySplit: 4 }],
    pageSetup: { orientation: "landscape", fitToPage: true, fitToWidth: 1, fitToHeight: 0 },
  });
  const P = 5, TOT = P + people.length;               // first person column, total column
  const L = (c) => ws.getColumn(c).letter;
  const argb = (hex) => ({ argb: "FF" + hex });
  const fill = (hex) => ({ type: "pattern", pattern: "solid", fgColor: argb(hex) });
  const tint = (hex, a) => hex.match(/../g).map((h) => Math.round(255 - (255 - parseInt(h, 16)) * a).toString(16).padStart(2, "0")).join("").toUpperCase();
  const line = { style: "thin", color: argb("D9DEE7") };
  const box = (cell) => { cell.border = { top: line, left: line, bottom: line, right: line }; };
  const unitFmt = (u) => `#,##0 "${u.replace(/"/g, "")}";-#,##0;""`;
  ws.columns = [12, 14, 22, 9, ...people.map(() => 11), 16].map((width) => ({ width }));

  ws.getCell(1, 1).value = `${CFG.COMPANY_NAME} — daily counts`;
  ws.getCell(1, 1).font = { bold: true, size: 14 };
  ws.getCell(2, 1).value = KPI.fmtDate(day, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  ws.getCell(2, 1).font = { size: 11, color: argb("4B5563") };

  const hdr = ws.getRow(4);
  hdr.values = ["Dept", "Machine", "Task", "Unit", ...people.map((p) => p.name), "Total"];
  hdr.height = 22;
  for (let c = 1; c <= TOT; c++) {
    const cell = hdr.getCell(c);
    cell.font = { bold: true, color: argb("FFFFFF") }; cell.fill = fill("1F2937"); box(cell);
    cell.alignment = { vertical: "middle", horizontal: c < P ? "left" : c === TOT ? "right" : "center" };
  }

  let r = 5, dept = null;
  for (const j of jobs) {
    if (j.department !== dept) {                       // department band, like the sheet's Dept column
      dept = j.department;
      const i = KPI.deptNames(data).indexOf(dept), col = i < 0 ? "6B7280" : XL_DEPT[i % 8];
      const band = ws.getRow(r++);
      band.height = 20;
      band.getCell(1).value = dept;
      band.getCell(1).font = { bold: true, color: argb(col) };
      for (let c = 1; c <= TOT; c++) { band.getCell(c).fill = fill(tint(col, 0.16)); box(band.getCell(c)); }
    }
    const row = ws.getRow(r);
    row.getCell(2).value = j.machine || null;
    row.getCell(3).value = j.name + (j.active ? "" : " (removed)");
    row.getCell(4).value = j.unit;
    row.getCell(2).font = row.getCell(4).font = { color: argb("6B7280") };
    let sum = 0;
    people.forEach((p, k) => {
      const cell = row.getCell(P + k), q = val(j, p);
      if (q != null) { cell.value = q; sum += q; }
      cell.numFmt = "#,##0";
      if (!p.departments.includes(j.department)) cell.fill = fill("F3F4F6");   // not their department (hatched on screen)
    });
    const t = row.getCell(TOT);
    t.value = { formula: `SUM(${L(P)}${r}:${L(TOT - 1)}${r})`, result: sum };
    t.numFmt = unitFmt(j.unit); t.font = { bold: true };
    for (let c = 1; c <= TOT; c++) box(row.getCell(c));
    r++;
  }

  const foot = ws.getRow(r);
  foot.getCell(3).value = "Tasks filled";
  people.forEach((p, k) => {
    const c = P + k;
    foot.getCell(c).value = { formula: `COUNT(${L(c)}5:${L(c)}${r - 1})`, result: jobs.filter((j) => val(j, p) != null).length };
    foot.getCell(c).numFmt = `0;-0;"–"`;
  });
  for (let c = 1; c <= TOT; c++) {
    const cell = foot.getCell(c);
    cell.font = { bold: true, color: argb("374151") }; cell.fill = fill("E5E7EB");
    cell.border = { top: { style: "medium", color: argb("9CA3AF") }, left: line, bottom: line, right: line };
    if (c >= P) cell.alignment = { horizontal: "center" };
  }

  const buf = await wb.xlsx.writeBuffer();
  return new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}

// ───────── approvals ─────────
// Counts employees sent from the app: approve as sent, change the number first, or reject (with an optional reason).
// Decided ones from the last 30 days can be opened and changed again.
let showDecided = false;
function renderApprovals() {
  const el = document.getElementById("appr");
  if (!el) return;
  const subs = admin.submissions || [];
  const pending = subs.filter((x) => x.status === "pending"), decided = subs.filter((x) => x.status !== "pending");
  el.hidden = !pending.length && !decided.length;
  if (el.hidden) return;
  const chip = (x) => ({
    approved: '<span class="pill pill-good">Approved</span>',
    edited: `<span class="pill pill-warning">Changed to ${KPI.fmtFull(x.final_qty)}</span>`,
    rejected: '<span class="pill pill-critical">Rejected</span>',
  }[x.status] || "");
  const row = (x) => {
    const j = data.jobById[x.job], who = data.empByName[x.employee] || { name: x.employee, department: "" };
    return `<div class="ap-row ${x.status}" data-id="${x.id}" data-qty="${x.qty}">
      ${KPI.avatar(who, { size: "38px" })}
      <div class="ap-who"><b>${esc(x.employee)}</b><span>${dot(j?.department)}${esc(KPI.jobLabel(j))} · ${esc(KPI.fmtDate(x.date))}</span></div>
      <div class="ap-sent">sent <b>${KPI.fmtFull(x.qty)}</b> ${esc(j?.unit || "")} ${chip(x)}${x.note ? `<small>“${esc(x.note)}”</small>` : ""}</div>
      <div class="ap-act">
        <input class="ap-q" inputmode="decimal" value="${x.status === "rejected" ? x.qty : x.final_qty ?? x.qty}" aria-label="Count to approve for ${esc(x.employee)}">
        <input class="ap-note" placeholder="Reason (optional)" aria-label="Reason">
        <button type="button" class="btn primary ap-ok">${KPI.ICONS.check}${x.status === "pending" ? "Approve" : "Save"}</button>
        ${x.status === "rejected" ? "" : `<button type="button" class="btn danger ap-no">${KPI.ICONS.x}Reject</button>`}
      </div></div>`;
  };
  el.innerHTML = `
    <div class="ap-h"><h2>${pending.length ? `${pending.length} count${pending.length === 1 ? "" : "s"} waiting for approval` : "Nothing waiting for approval"}</h2>
      <span class="sp"></span>
      ${pending.length > 1 ? `<button type="button" class="btn" id="ap-all">${KPI.ICONS.check}Approve all ${pending.length} as sent</button>` : ""}
      ${decided.length ? `<button type="button" class="linkbtn" id="ap-done">${showDecided ? "Hide" : "Show"} decided (last 30 days)</button>` : ""}</div>
    ${pending.length ? `<div class="ap-list">${pending.map(row).join("")}</div>` : ""}
    ${showDecided ? `<div class="ap-list decided">${decided.map(row).join("")}</div>` : ""}
    <p class="hint">Change the number before approving to correct it; typing it in the sheet below works too. Once approved, the employee can't change it, but you still can here.</p>`;
  const after = async (msg) => { await reloadData(); toast(msg); viewEntry(); };
  el.querySelectorAll(".ap-row").forEach((r) => {
    const id = Number(r.dataset.id), sent = Number(r.dataset.qty);
    const busy = (on) => r.querySelectorAll("button").forEach((b) => (b.disabled = on));
    r.querySelector(".ap-ok").onclick = async () => {
      const q = KPI.parseQty(r.querySelector(".ap-q").value);
      if (!(q > 0)) return toast("Enter the number to approve (more than 0)", true);
      busy(true);
      try {
        await KPI.reviewSubmission(id, q === sent ? "approve" : "edit", q, r.querySelector(".ap-note").value.trim());
        await after(q === sent ? "Approved" : `Approved as ${KPI.fmtFull(q)}`);
      } catch (e) { busy(false); failed(e); }
    };
    r.querySelector(".ap-no")?.addEventListener("click", async () => {
      busy(true);
      try { await KPI.reviewSubmission(id, "reject", null, r.querySelector(".ap-note").value.trim()); await after("Rejected"); }
      catch (e) { busy(false); failed(e); }
    });
  });
  el.querySelector("#ap-all")?.addEventListener("click", async () => {
    if (!confirm(`Approve all ${pending.length} counts exactly as they were sent?`)) return;
    try { for (const x of pending) await KPI.reviewSubmission(x.id, "approve"); await after(`Approved ${pending.length} counts`); }
    catch (e) { failed(e); }
  });
  el.querySelector("#ap-done")?.addEventListener("click", () => { showDecided = !showDecided; renderApprovals(); });
}

// ───────── jobs ─────────
// The rows of the daily sheet, per department: optional machine / type, the job, and the unit it is counted in.
function viewJobs() {
  const v = document.getElementById("view");
  if (!data.departments.some((d) => d.name === tasksDept)) tasksDept = data.departments[0]?.name || "";
  const counts = {};
  data.entries.forEach((e) => { counts[e.job] = (counts[e.job] || 0) + 1; });
  const row = (j = {}) => `<tr data-id="${j.id ?? ""}" data-n="${counts[j.id] || 0}">
    <td><div class="ord"><button type="button" class="icon-btn up" title="Move up" aria-label="Move up">${KPI.ICONS.chevU}</button><button type="button" class="icon-btn dn" title="Move down" aria-label="Move down">${KPI.ICONS.chevD}</button></div></td>
    <td data-label="Machine / type (optional)"><input class="mc" value="${esc(j.machine || "")}" placeholder="—" aria-label="Machine or type (optional)"></td>
    <td data-label="Task"><input class="nm" value="${esc(j.name || "")}" placeholder="Task name" aria-label="Task name"></td>
    <td data-label="Unit"><input class="un" value="${esc(j.unit || "")}" placeholder="pcs" aria-label="Unit"></td>
    <td><button type="button" class="btn danger del">${KPI.ICONS.trash} Remove</button></td></tr>`;
  v.innerHTML = `<p class="hint">These are the rows of the <b>Daily entry</b> sheet, in the same order. <b>Machine / type</b> is optional (RT1, Collator 2 …).
    Each task has its own <b>unit</b>: people are compared with others who did the same task that day, and a department's total on the TV adds up the tasks counted in the department's unit (set in the Departments tab).
    Removing a task hides it; its past counts stay saved, and adding it back with the same name brings them back.</p>
    ${data.departments.length ? `<div class="toolbar"><nav class="dtabs" id="jtabs" aria-label="Department">${data.departments.map((d) =>
      `<button type="button" data-d="${esc(d.name)}" class="${d.name === tasksDept ? "on" : ""}" aria-pressed="${d.name === tasksDept}">${dot(d.name)}${esc(d.name)}<span class="n"></span></button>`).join("")}</nav></div>` : ""}
    ${data.departments.map((d) => `<div class="card tcard jobs-card" data-dept="${esc(d.name)}" ${d.name === tasksDept ? "" : "hidden"}>
      <div class="jobs-h">${dot(d.name)}<b>${esc(d.name)}</b><span class="hint">department total counts <b>${esc(d.unit)}</b></span></div>
      <table class="t job-table"><thead><tr><th style="width:92px">Order</th><th style="width:26%">Machine / type</th><th>Task</th><th style="width:150px">Unit</th><th style="width:110px"></th></tr></thead>
      <tbody>${data.jobs.filter((j) => j.active && j.department === d.name).map(row).join("")}</tbody></table>
      <div class="jobs-add"><button type="button" class="btn add">+ Add task to ${esc(d.name)}</button></div></div>`).join("") || '<p class="hint">Add a department first in the Departments tab.</p>'}
    <div class="savebar"><button class="btn primary" id="save">Save tasks</button><span class="hint" id="chg"></span></div>`;
  const mark = () => { dirty = true; document.getElementById("chg").textContent = "Unsaved changes"; countTasks(); };
  // One department at a time, picked with the tabs; the others stay on the page (hidden), so edits in every tab are saved together
  const cardOf = (d) => [...v.querySelectorAll(".jobs-card")].find((c) => c.dataset.dept === d);
  const show = (d) => {
    tasksDept = d;
    v.querySelectorAll(".jobs-card").forEach((c) => { c.hidden = c.dataset.dept !== d; });
    v.querySelectorAll("#jtabs [data-d]").forEach((b) => { b.classList.toggle("on", b.dataset.d === d); b.setAttribute("aria-pressed", b.dataset.d === d); });
    if (NARROW.matches) v.querySelector("#jtabs .on")?.scrollIntoView({ block: "nearest", inline: "center" });
  };
  const countTasks = () => v.querySelectorAll("#jtabs [data-d]").forEach((b) => {
    const n = cardOf(b.dataset.d).querySelectorAll("tbody tr").length;
    b.querySelector(".n").textContent = n; b.title = `${n} task${n === 1 ? "" : "s"}`;
  });
  v.querySelector("#jtabs")?.addEventListener("click", (e) => { const b = e.target.closest("[data-d]"); if (b) show(b.dataset.d); });
  countTasks();

  v.querySelectorAll(".jobs-card").forEach((card) => {
    const tb = card.querySelector("tbody");
    card.addEventListener("input", mark);
    const unit = data.deptByName[card.dataset.dept]?.unit || "pcs";
    card.querySelector(".add").onclick = () => { tb.insertAdjacentHTML("beforeend", row({ unit })); tb.lastElementChild.querySelector(".nm").focus(); mark(); };
    tb.addEventListener("click", (e) => {
      const tr = e.target.closest("tr"); if (!tr) return;
      if (e.target.closest(".up") && tr.previousElementSibling) { tb.insertBefore(tr, tr.previousElementSibling); mark(); }
      if (e.target.closest(".dn") && tr.nextElementSibling) { tb.insertBefore(tr.nextElementSibling, tr); mark(); }
      if (e.target.closest(".del")) {
        const n = Number(tr.dataset.n);
        if (n && !confirm(`“${tr.querySelector(".nm").value}” has ${n} count(s) in the last few months. Remove it from the sheet? Its counts stay saved.`)) return;
        tr.remove(); mark();
      }
    });
  });
  document.getElementById("save").onclick = async () => {
    const rows = [];
    for (const card of v.querySelectorAll(".jobs-card")) {
      const seen = new Set();
      for (const tr of card.querySelectorAll("tbody tr")) {
        const r = { id: tr.dataset.id ? Number(tr.dataset.id) : undefined, department: card.dataset.dept, machine: tr.querySelector(".mc").value.trim(), name: tr.querySelector(".nm").value.trim(), unit: tr.querySelector(".un").value.trim() || "pcs" };
        if (!r.name) { show(card.dataset.dept); tr.querySelector(".nm").focus(); return toast(`${card.dataset.dept}: a task needs a name`, true); }
        const k = (r.machine + "|" + r.name).toLowerCase();
        if (seen.has(k)) { show(card.dataset.dept); tr.querySelector(".nm").focus(); return toast(`${card.dataset.dept}: “${KPI.jobLabel(r)}” is listed twice`, true); }
        seen.add(k); rows.push(r);
      }
    }
    try { await KPI.saveJobs(rows); await reloadData(); dirty = false; toast("Tasks saved"); viewJobs(); }
    catch (e) { failed(e); }
  };
}

// ───────── departments ─────────
// Name, the unit it counts in, and the order (which also sets the colour on the TV).
function viewDepartments() {
  const v = document.getElementById("view");
  const members = (d) => data.employees.filter((e) => e.departments.includes(d)).map((e) => e.name);
  v.innerHTML = `<p class="hint">Departments group the tasks (Tasks tab) and the people. <b>Unit</b> is what the department's total on the TV counts: it adds up the department's tasks counted in that unit (for example <i>sheets</i>); tasks in other units are shown next to it.
    The order here is the order on the TV screens and sets each department's colour. Renaming keeps its tasks, history and people.
    Removing a department takes it off everyone's list and hides its tasks; their past counts stay saved.</p>
    <div class="card tcard"><table class="t dept-table"><thead><tr><th style="width:92px">Order</th><th>Department</th><th style="width:180px">Total counts</th><th>People</th><th style="width:110px"></th></tr></thead>
    <tbody id="tb">${data.departments.map((d) => row(d.name, d.unit, members(d.name))).join("")}</tbody></table></div>
    <div class="toolbar dept-add" style="margin-top:12px"><input id="newname" placeholder="New department name"><input id="newunit" placeholder="Unit, e.g. sheets" style="width:160px"><button class="btn" id="add">+ Add department</button></div>
    <div class="savebar"><button class="btn primary" id="save">Save departments</button><span class="hint" id="chg"></span></div>`;
  function row(name, unit, people = [], isNew = false) {
    return `<tr data-orig="${isNew ? "" : esc(name)}" data-people="${people.length}">
      <td><div class="ord"><button type="button" class="icon-btn up" title="Move up" aria-label="Move up">${KPI.ICONS.chevU}</button><button type="button" class="icon-btn dn" title="Move down" aria-label="Move down">${KPI.ICONS.chevD}</button></div></td>
      <td data-label="Department"><div class="dname"><span class="swatch"></span><input class="nm" value="${esc(name)}" aria-label="Department name"></div></td>
      <td data-label="Total counts"><input class="un" value="${esc(unit)}" placeholder="pcs" aria-label="Unit"></td>
      <td class="hint" data-label="People">${people.length ? `${people.length} · ${esc(people.join(", "))}` : "—"}</td>
      <td><button type="button" class="btn danger del">${KPI.ICONS.trash} Remove</button></td></tr>`;
  }
  const tb = document.getElementById("tb");
  // colour swatches follow the row order
  const paint = () => [...tb.querySelectorAll("tr")].forEach((tr, i) => { tr.querySelector(".swatch").style.background = `var(--dept-${(i % 8) + 1})`; });
  paint();
  const mark = () => { dirty = true; document.getElementById("chg").textContent = "Unsaved changes"; };
  tb.addEventListener("input", mark);
  tb.addEventListener("click", (e) => {
    const tr = e.target.closest("tr");
    if (e.target.closest(".up") && tr.previousElementSibling) { tr.parentNode.insertBefore(tr, tr.previousElementSibling); paint(); mark(); }
    if (e.target.closest(".dn") && tr.nextElementSibling) { tr.parentNode.insertBefore(tr.nextElementSibling, tr); paint(); mark(); }
    if (e.target.closest(".del")) {
      const n = Number(tr.dataset.people), name = tr.querySelector(".nm").value;
      if (n && !confirm(`${n} ${n === 1 ? "person is" : "people are"} in “${name}”. Remove it from them? Their past counts stay saved.`)) return;
      tr.remove(); paint(); mark();
    }
  });
  document.getElementById("add").onclick = () => {
    const n = document.getElementById("newname").value.trim(), u = document.getElementById("newunit").value.trim() || "pcs";
    if (!n) return document.getElementById("newname").focus();
    tb.insertAdjacentHTML("beforeend", row(n, u, [], true)); paint(); mark();
    document.getElementById("newname").value = ""; document.getElementById("newunit").value = "";
  };
  document.getElementById("save").onclick = async () => {
    const rows = [];
    for (const tr of tb.querySelectorAll("tr")) {
      const name = tr.querySelector(".nm").value.trim(), unit = tr.querySelector(".un").value.trim() || "pcs", orig = tr.dataset.orig;
      if (!name) return toast("A department needs a name", true);
      if (name.includes(",")) return toast(`“${name}”: department names can't contain commas`, true);
      if (rows.some((r) => r.name.toLowerCase() === name.toLowerCase())) return toast(`Two departments are called “${name}”`, true);
      rows.push({ name, unit, renamedFrom: orig && orig !== name ? orig : undefined });
    }
    try { await KPI.saveDepartments(rows); await reloadData(); dirty = false; toast("Departments saved"); viewDepartments(); }
    catch (e) { failed(e); }
  };
}

// ───────── employees ─────────
// A small modal on top of the page (logins, task lists). Returns the <dialog>; it removes itself when closed.
function modal(html) {
  const d = document.createElement("dialog");
  d.className = "dlg";
  d.innerHTML = html;
  document.body.appendChild(d);
  d.addEventListener("close", () => d.remove());
  d.addEventListener("click", (e) => { if (e.target === d) d.close(); });
  d.querySelectorAll("[data-close]").forEach((b) => (b.onclick = () => d.close()));
  d.showModal();
  return d;
}
// "Xk7-mPq2" — easy to read out to someone (no 0/O/1/l)
const newPassword = () => { const c = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s = ""; const r = crypto.getRandomValues(new Uint32Array(8)); r.forEach((x, i) => { s += c[x % c.length] + (i === 3 ? "-" : ""); }); return s; };
const suggestUsername = (name) => name.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, ".").replace(/^\.|\.$/g, "").slice(0, 32) || "user";

// Set or change one login (employee or TV screen). After saving it shows the details to pass on.
function loginDialog({ kind, employee = "", username = "", label = "", onDone }) {
  const exists = !!username;
  const d = modal(`<form method="dialog" class="dlg-in" id="lg">
    <h2>${kind === "employee" ? `Login for ${esc(employee)}` : exists ? `TV screen login “${esc(username)}”` : "New TV screen login"}</h2>
    <p class="hint">${kind === "employee"
      ? "They sign in on the app (or the website) with this username and password and see only their own page."
      : "Sign each wall TV in once with this login and tick “Keep me signed in”. It can open every screen but change nothing."}</p>
    <label class="fl">Username<input id="d-un" autocomplete="off" autocapitalize="none" spellcheck="false" value="${esc(username || (kind === "employee" ? suggestUsername(employee) : "tv1"))}"></label>
    ${kind === "viewer" ? `<label class="fl">Label (where is it?)<input id="d-lb" value="${esc(label)}" placeholder="e.g. Factory floor TV"></label>` : ""}
    <label class="fl">${exists ? "New password <small>(leave empty to keep the current one)</small>" : "Password"}
      <span class="pwrow"><input id="d-pw" autocomplete="new-password" spellcheck="false" placeholder="${exists ? "unchanged" : "at least 6 characters"}" value="${exists ? "" : newPassword()}"><button type="button" class="btn" id="d-gen">New</button></span></label>
    <div class="err" id="d-err"></div>
    <div class="dlg-btns">${exists ? `<button type="button" class="btn danger" id="d-del">${KPI.ICONS.trash}Remove login</button>` : ""}<span class="sp"></span>
      <button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary" id="d-ok">Save login</button></div>
  </form>`);
  const $ = (id) => d.querySelector("#" + id);
  $("d-gen").onclick = () => { $("d-pw").value = newPassword(); };
  const done = (html) => {
    d.querySelector(".dlg-in").innerHTML = html + `<div class="dlg-btns"><span class="sp"></span><button type="button" class="btn primary" id="d-close">Done</button></div>`;
    $("d-close").onclick = () => d.close();
    onDone?.();
  };
  $("lg").onsubmit = async (e) => {
    e.preventDefault();
    const un = $("d-un").value.trim().toLowerCase(), pw = $("d-pw").value.trim();
    $("d-ok").disabled = true; $("d-err").textContent = "";
    try {
      await KPI.adminUsers({ action: "save", kind, employee, username: un, password: pw || undefined, label: $("d-lb")?.value.trim(), current: username || undefined });
      done(`<h2>Login saved</h2><p class="hint">Give ${kind === "employee" ? esc(employee) : "the TV"} these details:</p>
        <div class="creds"><div>Username<b>${esc(un)}</b></div><div>Password<b>${pw ? esc(pw) : "(unchanged)"}</b></div></div>
        <p class="hint">The password isn't shown again. You can always set a new one here.</p>`);
    } catch (ex) { $("d-err").textContent = ex.message; $("d-ok").disabled = false; }
  };
  $("d-del")?.addEventListener("click", async () => {
    if (!confirm(`Remove the login “${username}”? ${kind === "employee" ? `${employee} won't be able to sign in. Their counts stay.` : "That TV will be signed out."}`)) return;
    try { await KPI.adminUsers({ action: "delete", kind, employee, username }); done(`<h2>Login removed</h2><p class="hint">“${esc(username)}” can't sign in any more.</p>`); }
    catch (ex) { $("d-err").textContent = ex.message; }
  });
}

// Pick an employee's standing list of tasks (they report counts on these in the app; new ones notify them).
function tasksDialog(name, onDone) {
  const mine = new Set(tasksOf(name));
  const emp = data.empByName[name];
  const groups = deptNames().map((dn) => ({ dn, jobs: data.jobs.filter((j) => j.active && j.department === dn) })).filter((g) => g.jobs.length);
  // their own departments first
  groups.sort((a, b) => (emp?.departments.includes(b.dn) ? 1 : 0) - (emp?.departments.includes(a.dn) ? 1 : 0));
  const d = modal(`<form method="dialog" class="dlg-in wide" id="tk">
    <h2>Tasks for ${esc(name)}</h2>
    <p class="hint">Tick the tasks ${esc(name)} usually does. They see these in the app and send a count for each one they did that day. Newly added tasks are sent to them as a notification.</p>
    <input type="search" id="t-q" class="t-q" placeholder="Find a task…" aria-label="Find a task">
    <div class="tk-list">${groups.map((g) => `<fieldset data-d="${esc(g.dn)}"><legend>${dot(g.dn)}${esc(g.dn)}</legend>
      ${g.jobs.map((j) => `<label class="tk" data-s="${esc((g.dn + " " + KPI.jobLabel(j)).toLowerCase())}"><input type="checkbox" value="${j.id}" ${mine.has(j.id) ? "checked" : ""}><span>${esc(KPI.jobLabel(j))}</span><small>${esc(j.unit)}</small></label>`).join("")}
    </fieldset>`).join("")}</div>
    <div class="err" id="t-err"></div>
    <div class="dlg-btns"><span class="hint" id="t-n"></span><span class="sp"></span><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary" id="t-ok">Save tasks</button></div>
  </form>`);
  const count = () => { d.querySelector("#t-n").textContent = `${d.querySelectorAll(".tk input:checked").length} ticked`; };
  d.addEventListener("change", count); count();
  d.querySelector("#t-q").oninput = (e) => {
    const q = e.target.value.trim().toLowerCase();
    d.querySelectorAll(".tk").forEach((l) => { l.hidden = q && !l.dataset.s.includes(q); });
    d.querySelectorAll("fieldset").forEach((f) => { f.hidden = ![...f.querySelectorAll(".tk")].some((l) => !l.hidden); });
  };
  d.querySelector("#tk").onsubmit = async (e) => {
    e.preventDefault();
    const ids = [...d.querySelectorAll(".tk input:checked")].map((i) => Number(i.value));
    d.querySelector("#t-ok").disabled = true;
    try { await KPI.saveAssignments(name, ids); d.close(); toast(`Saved ${ids.length} task(s) for ${name}`); onDone?.(); }
    catch (ex) { d.querySelector("#t-err").textContent = ex.message; d.querySelector("#t-ok").disabled = false; }
  };
}

function viewEmployees() {
  const v = document.getElementById("view");
  const depts = deptNames();
  const photos = new WeakMap(); // <tr> -> photo data URL

      <div class="ph-act"><label class="linkbtn">Upload<input type="file" accept="image/*" class="ph-in"></label><button type="button" class="linkbtn danger ph-rm" ${e.photo ? "" : "hidden"}>Remove</button></div>

    <td data-label="Also works in"><div class="chips also-chips">${opts.map((d) => { const on = e.departments.slice(1).includes(d); return `<label class="chip ${on ? "on" : ""}" ${d === e.department ? "hidden" : ""}><input type="checkbox" class="dp2" value="${esc(d)}" ${on ? "checked" : ""}>${esc(d)}</label>`; }).join("")}</div></td>

  };
  v.innerHTML = `<p class="hint">Click a picture (or <b>Upload</b>) to add a profile photo. Pick each person's <b>main department</b> and tick any others they also work in: that decides where they appear on the TV. <b>Login</b> gives them a username and password for the app, where they see only their own page; <b>Tasks</b> are what they send counts for. Untick <b>Show</b> to hide someone from the TV without deleting their history. Renaming keeps past counts, login and tasks linked.</p>
    <div class="card tcard"><table class="t emp-table"><thead><tr><th>Photo</th><th>Name</th><th>Main department</th><th>Also works in</th><th>Login</th><th>Tasks</th><th>TV</th><th></th></tr></thead><tbody id="tb">${data.employees.map(row).join("")}</tbody></table></div>
    <div class="toolbar" style="margin-top:12px"><button class="btn" id="add">+ Add employee</button><span class="hint">Add or rename departments in the Departments tab. Save new people before giving them a login or tasks.</span></div>
    <div class="savebar"><button class="btn primary" id="save">Save employees</button><span class="hint" id="chg"></span></div>
    <section class="tv-logins">
      <h2>TV screen logins</h2>
      <p class="hint">The TV screens need a sign-in. Create a login for the TVs (one each, or one shared), then sign each TV in once with “Keep me signed in” ticked. These logins can open every screen but change nothing.</p>
      <div class="card tcard"><table class="t tv-table"><thead><tr><th>Username</th><th>Where</th><th></th></tr></thead><tbody id="tvb">${(admin.viewers || []).map((x) => `<tr data-u="${esc(x.username)}" data-l="${esc(x.label)}">
        <td data-label="Username"><span class="login-u">${KPI.ICONS.key}<b>${esc(x.username)}</b></span></td><td data-label="Where">${esc(x.label) || '<span class="hint">—</span>'}</td>
        <td><button type="button" class="btn tv-edit">Change</button></td></tr>`).join("") || '<tr><td colspan="3" class="hint">No TV logins yet.</td></tr>'}</tbody></table></div>
      <div class="toolbar" style="margin-top:12px"><button class="btn" id="add-tv">+ Add TV login</button></div>
    </section>`;
  const tb = document.getElementById("tb");
  tb.querySelectorAll("tr").forEach((tr, i) => photos.set(tr, data.employees[i]?.photo || ""));
  const mark = () => { dirty = true; document.getElementById("chg").textContent = "Unsaved changes"; };
  const paintAvatar = (tr) => {
    const name = tr.querySelector(".nm").value.trim() || "?";
    const tmp = { name, department: tr.querySelector(".dp").value, photo: photos.get(tr) || "" };
    tr.querySelector(".ph-av .av").outerHTML = KPI.avatar(tmp, { size: "48px" });
    tr.querySelector(".ph-rm").hidden = !tmp.photo;
  };
  // refresh the Login / Tasks cells after a dialog, keeping anything typed in the table
  const refreshCells = async () => {
    const a = await KPI.adminData();
    admin = { ...a, submissions: (a.submissions || []).map((s) => ({ ...s, qty: Number(s.qty), final_qty: s.final_qty == null ? null : Number(s.final_qty) })) };
    tb.querySelectorAll("tr").forEach((tr) => {
      const n = tr.dataset.orig; if (!n) return;
      tr.querySelector(".lg-cell").innerHTML = loginCell(n);
      tr.querySelector(".tk-cell").innerHTML = tasksCell(n);
    });
  };
  tb.addEventListener("change", async (e) => {
    mark();
    if (e.target.closest(".chip")) e.target.closest(".chip").classList.toggle("on", e.target.checked);
    const tr = e.target.closest("tr");
    if (e.target.classList.contains("ph-in") && e.target.files[0]) {
      try { photos.set(tr, await KPI.resizePhoto(e.target.files[0])); paintAvatar(tr); toast("Photo added — click Save employees to keep it"); }
      catch (ex) { toast(ex.message, true); }
      e.target.value = "";
    }
    if (e.target.classList.contains("dp")) {
      // the main department can't also be an extra one
      tr.querySelectorAll(".dp2").forEach((c) => { const main = c.value === e.target.value; c.closest(".chip").hidden = main; if (main) { c.checked = false; c.closest(".chip").classList.remove("on"); } });
      paintAvatar(tr);
    }
  });
  tb.addEventListener("click", (e) => {
    const tr = e.target.closest("tr"); if (!tr) return;
    const saved = tr.dataset.orig, typed = tr.querySelector(".nm").value.trim();
    if (e.target.classList.contains("ph-rm")) { photos.set(tr, ""); paintAvatar(tr); mark(); }
    if (e.target.closest(".set-login, .tasks-btn")) {
      if (!saved || typed !== saved) return toast("Save employees first (new or renamed people)", true);
      if (e.target.closest(".set-login")) loginDialog({ kind: "employee", employee: saved, username: admin.logins?.[saved] || "", onDone: refreshCells });
      else tasksDialog(saved, refreshCells);
    }
    if (e.target.closest(".del-emp")) {
      const who = typed || saved || "this row";
      if (!confirm(`Remove ${who}? ${admin.logins?.[saved] ? "Their login is deleted too. " : ""}Their past counts stay saved. (Click Save employees to finish.)`)) return;
      tr.remove(); mark();
    }
  });
  tb.addEventListener("focusout", (e) => { if (e.target.classList.contains("nm")) paintAvatar(e.target.closest("tr")); });
  tb.addEventListener("input", mark);
  document.getElementById("add").onclick = () => {
    tb.insertAdjacentHTML("beforeend", row({ name: "", department: depts[0] || "", departments: depts[0] ? [depts[0]] : [], active: true, photo: "" }));
    photos.set(tb.lastElementChild, ""); tb.lastElementChild.dataset.orig = ""; tb.lastElementChild.querySelector(".nm").focus(); mark();
  };
  document.getElementById("save").onclick = async () => {
    const list = [];
    for (const tr of tb.querySelectorAll("tr")) {
      const name = tr.querySelector(".nm").value.trim();
      if (!name) continue;
      if (list.some((x) => x.name.toLowerCase() === name.toLowerCase())) { toast(`Duplicate name: ${name}`, true); return; }
      const orig = tr.dataset.orig;
      const main = tr.querySelector(".dp").value;
      const department = [main, ...[...tr.querySelectorAll(".dp2:checked")].map((i) => i.value)].filter((d, i, a) => d && a.indexOf(d) === i).join(", ");
      list.push({ name, department, active: tr.querySelector(".ac").checked, photo: photos.get(tr) || "", renamedFrom: orig && orig !== name ? orig : undefined });
    }
    // people removed (or emptied) who had a login: delete their login first
    const kept = new Set(list.flatMap((x) => [x.name, x.renamedFrom].filter(Boolean)));
    const gone = data.employees.map((x) => x.name).filter((n) => !kept.has(n) && admin.logins?.[n]);
    try {
      for (const n of gone) await KPI.adminUsers({ action: "delete", kind: "employee", employee: n });
      await KPI.saveEmployees(list); await reloadData(); dirty = false; toast("Employees saved"); viewEmployees();
    } catch (e) { failed(e); }
  };
  // TV screen logins (saved straight away, separate from the table above)
  document.getElementById("add-tv").onclick = () => loginDialog({ kind: "viewer", onDone: () => { reloadData().then(() => { if (!dirty) viewEmployees(); }); } });
  document.getElementById("tvb").addEventListener("click", (e) => {
    const tr = e.target.closest("tr[data-u]");
    if (tr && e.target.closest(".tv-edit")) loginDialog({ kind: "viewer", username: tr.dataset.u, label: tr.dataset.l, onDone: () => { reloadData().then(() => { if (!dirty) viewEmployees(); }); } });
  });
}

boot();
</script>
</body>
