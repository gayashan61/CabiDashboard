<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slideshow · Production KPI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/config.js"></script>
<script src="assets/theme.js"></script>
<style>
  .stage { position: relative; height: 100%; }
  .slide { position: absolute; inset: 0; opacity: 0; transform: translateY(8px); transition: opacity .6s ease, transform .6s ease; display: grid; gap: 1.3rem; pointer-events: none; }
  .slide.on { opacity: 1; transform: none; pointer-events: auto; }
  .slidebar { display: flex; align-items: center; gap: 1rem; padding: 0.7rem 2rem; background: var(--surface); border-top: 1px solid var(--border); }
  .slidebar .lbl { font-size: 0.9rem; color: var(--muted); white-space: nowrap; min-width: 9rem; font-variant-numeric: tabular-nums; }
  .progress { flex: 1; display: flex; gap: 0.3rem; }
  .progress i { flex: 1; height: 0.3rem; border-radius: 999px; background: var(--surface-3); overflow: hidden; position: relative; }
  .progress i.done { background: var(--axis); }
  .progress i.on > b { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 999px; }
  .slide-ctrl { display: flex; gap: 0.35rem; }
  .slide-ctrl .icon-btn { width: 2.1rem; height: 2.1rem; box-shadow: none; }
  .slide-ctrl .icon-btn svg { width: 0.95rem; height: 0.95rem; }
  .slide-ctrl #play { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .slide-ctrl #play:hover { filter: brightness(1.08); }
  .paused .progress i.on > b { background: var(--muted); }

  /* overview */
  .ov { grid-template-columns: 1.15fr 1fr; grid-template-rows: auto minmax(0, 1fr); }
  .kpis { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 1.3rem; }
  .kpi { padding: 1.3rem 1.5rem; display: flex; flex-direction: column; gap: 0.55rem; }
  .kpi-l { color: var(--ink-2); font-size: 1.05rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
  .kpi-l > span:first-child { display: flex; align-items: center; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi-v { font-size: 3.6rem; font-weight: 800; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .kpi-v span { font-size: 1.8rem; color: var(--muted); font-weight: 600; letter-spacing: 0; }
  .kpi-s { color: var(--muted); font-size: 0.92rem; }
  .kpi .bar { height: 0.45rem; margin-top: 0.2rem; }
  .lb { display: flex; flex-direction: column; flex: 1; justify-content: space-around; }
  .lb-row { display: grid; grid-template-columns: 2.2rem 3.4rem minmax(0, 1fr) auto; align-items: center; gap: 1rem; padding: 0.55rem 0; border-bottom: 1px solid var(--grid); }
  .lb-row:last-child { border-bottom: 0; }
  .lb-rank { width: 2.2rem; height: 2.2rem; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 1.15rem; background: var(--surface-2); color: var(--ink-2); }
  .lb-rank.r1 { background: var(--warning-soft); color: var(--warning-ink); }
  .lb-name { font-weight: 700; font-size: 1.4rem; letter-spacing: -0.01em; }
  .lb-name small { display: flex; align-items: center; font-size: 0.9rem; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-top: 0.1rem; }
  .lb-val { text-align: right; font-weight: 800; font-size: 1.6rem; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lb-val small { font-size: 0.85rem; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 0.25rem; }
  .lb-val em { display: block; font-style: normal; font-size: 0.85rem; font-weight: 600; letter-spacing: 0; }
  /* department trends: one small chart per department */
  .dtrends { display: flex; flex-direction: column; flex: 1; min-height: 0; gap: 0.4rem; }
  .dtrend { flex: 1; min-height: 3.5rem; display: grid; grid-template-columns: 9rem minmax(0, 1fr) 6.5rem; align-items: center; gap: 1rem; border-bottom: 1px solid var(--grid); padding-bottom: 0.4rem; }
  .dtrend:last-child { border-bottom: 0; }
  .dtrend-n { font-size: 1.15rem; font-weight: 600; display: flex; align-items: center; white-space: nowrap; overflow: hidden; }
  .dtrend-c { height: 100%; min-height: 3rem; }
  .dtrend-v { text-align: right; font-size: 1.4rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .dtrend-v small { display: block; font-size: 0.8rem; font-weight: 500; color: var(--muted); }
  .dept-row { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr) 4.5rem; align-items: center; gap: 0.9rem; font-size: 1.2rem; white-space: nowrap; font-weight: 600; }
  .dept-row > div:first-child { display: flex; align-items: center; }
  .dept-row .bar { height: 1rem; }
  .dept-row .v { text-align: right; font-variant-numeric: tabular-nums; }

</style>
</head>
<body>
<div class="tv">
  <header class="tv-header" id="hdr"></header>
  <main class="tv-main"><div class="stage" id="stage"></div></main>
  <div class="slidebar">
    <div class="slide-ctrl">
      <button class="icon-btn" id="prev" title="Previous slide (←)" aria-label="Previous slide"></button>
      <button class="icon-btn" id="play" title="Pause (Space)" aria-label="Pause"></button>
      <button class="icon-btn" id="next" title="Next slide (→)" aria-label="Next slide"></button>
    </div>
    <span class="lbl" id="slbl"></span><div class="progress" id="dots"></div></div>
</div>
<script src="assets/core.js"></script>
<script>
const { CFG, esc, fmtNum, fmtFull, ICONS, status } = KPI;
const qs = new URLSearchParams(location.search);
const SECS = Number(qs.get("interval")) || CFG.SLIDE_SECONDS;
KPI.mountHeader(document.getElementById("hdr"), "Team Performance", "tv-slides.html");

let slides = [];
let idx = 0;
let startedAt = Date.now();
let paused = false;
let pausedAt = 0;

// Team overview: each department's total today against its recent days, trends, and today's standouts
function overview(people, data, day) {
  const on = KPI.dayWord(day);
  const depts = KPI.deptNames(data).map((name) => {
    const dd = KPI.deptDay(data, name, day);
    const weekAvg = KPI.deptWeekAvg(data, name, day);
    const members = people.filter((p) => p.departments.includes(name)).length;
    return { name, unit: KPI.unit(data, name), ...dd, weekAvg, members, vs: dd.total != null && weekAvg ? dd.total / weekAvg : null };
  });
  // Each person's best job today, ranked by how far above that job's average they are
  const top = people.filter((p) => p.today.has)
    .map((p) => ({ p, t: [...p.today.parts].sort((a, b) => (b.ratio ?? 1) - (a.ratio ?? 1))[0] }))
    .sort((a, b) => (b.t.ratio ?? 1) - (a.t.ratio ?? 1) || b.t.qty - a.t.qty).slice(0, 6);
  return `<div class="slide ov">
    <div class="kpis">${depts.map((d) => {
      const s = status(d.vs);
      return `<div class="card kpi"><div class="kpi-l"><span><span class="dept-dot" style="background:${KPI.deptColor(d.name)}"></span>${esc(d.name)}</span>${d.vs == null ? "" : KPI.pill(d.vs, KPI.vsAvg(d.vs).replace("vs avg", "vs 7-day").replace("at avg", "= 7-day avg"))}</div>
        <div class="kpi-v">${d.total == null ? "–" : fmtNum(d.total)}<span> ${esc(d.unit)}</span></div>
        <div class="bar" title="Tick = average daily total of the last 7 working days"><span class="bg-${s.key}" style="width:${KPI.ratioW(d.vs)}%"></span><i class="tgt" style="left:${KPI.AVG_TICK}%"></i></div>
        <div class="kpi-s">7-day avg ${fmtNum(d.weekAvg)} · ${d.n} of ${d.members} logged${d.others.map((o) => ` · + ${fmtNum(o.total)} ${esc(o.unit)}`).join("")}</div></div>`;
    }).join("") || '<div class="card kpi"><div class="kpi-s">No departments yet — add them in Admin ➜ Departments.</div></div>'}</div>
    <div class="card panel"><div class="card-h"><h2 class="card-title">Department totals</h2><span class="card-sub">per day · last 20 working days</span></div>
      <div class="dtrends">${depts.map((d) => `<div class="dtrend">
        <div class="dtrend-n"><span class="dept-dot" style="background:${KPI.deptColor(d.name)}"></span>${esc(d.name)}</div>
        <div class="dtrend-c">${KPI.trendChart(KPI.deptSeries(data, d.name, day, 20), { mini: true, color: KPI.deptColor(d.name) })}</div>
        <div class="dtrend-v">${d.total == null ? "–" : fmtNum(d.total)}<small>${esc(d.unit)} ${esc(on)}</small></div></div>`).join("")}</div></div>
    <div class="card panel"><div class="card-h"><h2 class="card-title" style="display:flex;align-items:center;gap:.5rem">${ICONS.trophy} Top performers ${on}</h2><span class="card-sub">vs the average on the same job</span></div>
      <div class="lb">${top.length ? top.map(({ p, t }, i) => {
        const s = status(t.ratio);
        return `<div class="lb-row"><div class="lb-rank ${i === 0 ? "r1" : ""}">${i + 1}</div>${KPI.avatar(p, { size: "3.4rem", ring: s.key })}
          <div class="lb-name">${esc(p.name)}<small title="${esc(t.dept)}"><span class="dept-dot" style="background:${KPI.deptColor(t.dept)}"></span>${esc(t.label)}</small></div>
          <div class="lb-val">${fmtFull(t.qty)}<small>${esc(t.unit)}</small><em class="st-${s.key}">${esc(t.n > 1 ? KPI.vsAvg(t.ratio) : "only one on this job")}</em></div></div>`;
      }).join("") : '<div class="empty">No counts yet for this day</div>'}</div></div>
  </div>`;
}

function render(data) {
  const day = KPI.displayDay(data);
  KPI.setHeaderDay(day);
  const people = KPI.summaries(data, day);
  const names = KPI.deptNames(data);
  const deptIdx = (d) => { const i = names.indexOf(d); return i < 0 ? 99 : i; };
  people.sort((a, b) => deptIdx(a.department) - deptIdx(b.department) || a.name.localeCompare(b.name));
  const curKey = slides[idx]?.key;
  slides = [{ key: "__overview", title: "Team overview", html: overview(people, data, day) }, ...people.map((p) => ({ key: p.name, title: p.name, html: `<div class="slide ps">${KPI.personView(p, day, data)}</div>` }))];
  const keep = slides.findIndex((s) => s.key === curKey);
  idx = keep >= 0 ? keep : 0;
  const stage = document.getElementById("stage");
  stage.innerHTML = slides.map((s) => s.html).join("");
  stage.children[idx]?.classList.add("on");
  drawDots();
}

function drawDots() {
  document.getElementById("dots").innerHTML = slides.map((_, i) => `<i class="${i === idx ? "on" : i < idx ? "done" : ""}">${i === idx ? '<b id="pbar"></b>' : ""}</i>`).join("");
  document.getElementById("slbl").textContent = `${idx + 1} / ${slides.length} · ${slides[idx]?.title || ""}${paused ? " · Paused" : ""}`;
}

function go(n) {
  const stage = document.getElementById("stage");
  stage.children[idx]?.classList.remove("on");
  idx = (n + slides.length) % slides.length;
  stage.children[idx]?.classList.add("on");
  startedAt = pausedAt = Date.now();
  drawDots();
  tick();
}

function setPaused(v) {
  if (v === paused) return;
  if (v) pausedAt = Date.now(); else startedAt += Date.now() - pausedAt;
  paused = v;
  const b = document.getElementById("play");
  b.innerHTML = paused ? ICONS.playSolid : ICONS.pause;
  b.title = paused ? "Play (Space)" : "Pause (Space)";
  b.setAttribute("aria-label", paused ? "Play" : "Pause");
  document.body.classList.toggle("paused", paused);
  drawDots();
  tick();
}

function tick() {
  const el = ((paused ? pausedAt : Date.now()) - startedAt) / 1000;
  const b = document.getElementById("pbar"); if (b) b.style.width = Math.min(100, el / SECS * 100) + "%";
  if (!paused && el >= SECS && slides.length) go(idx + 1);
}

setInterval(tick, 150);
document.getElementById("prev").innerHTML = ICONS.chevL;
document.getElementById("next").innerHTML = ICONS.chevR;
document.getElementById("play").innerHTML = ICONS.pause;
document.getElementById("prev").onclick = () => go(idx - 1);
document.getElementById("next").onclick = () => go(idx + 1);
document.getElementById("play").onclick = () => setPaused(!paused);
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, select, textarea") || (e.key === " " && e.target.closest("button"))) return;
  if (e.key === "ArrowRight") go(idx + 1);
  if (e.key === "ArrowLeft") go(idx - 1);
  if (e.key === " " || e.key === "k") { e.preventDefault(); setPaused(!paused); }
});

KPI.autoRefresh(render);
</script>
</body>
</html>
