<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiljay CF Pro</title>
<style>
  :root { color-scheme: light dark; --bg: #eef3f7; --card: #fff; --ink: #111c24; --muted: #5d6d7a; --accent: #0077c0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0e14; --card: #141922; --ink: #f4f6fa; --muted: #8691a3; --accent: #1597de; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
  .card { background: var(--card); border-radius: 18px; padding: 28px; max-width: 360px; text-align: center; box-shadow: 0 12px 32px -8px rgba(0,0,0,.25); }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; line-height: 1.5; }
  button { min-height: 48px; padding: 0 28px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; font-size: 16px; }
</style>
</head>
<body>
<!-- Shown by the Android app when it can't load the site (no internet, server down). -->
<div class="card">
  <h1>Can't reach Tiljay CF Pro</h1>
  <p>Check that the phone is connected to the internet (Wi-Fi or mobile data), then try again.</p>
  <button onclick="location.replace(window.__appUrl || 'https://kpidashboard-one.vercel.app/')">Try again</button>
</div>
</body>
</html>
