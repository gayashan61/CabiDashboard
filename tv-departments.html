<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Departments · Tiljay CF Pro</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Tiljay CF Pro">
<meta name="application-name" content="Tiljay CF Pro">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/config.js"></script>
<script src="assets/theme.js"></script>
<style>
  .cols { display: grid; gap: 1.2rem; height: 100%; }
  .col { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .col-head { padding: 1.2rem 1.4rem 1rem; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, color-mix(in srgb, var(--dc) 10%, transparent), transparent); }
  .col-top { display: flex; align-items: center; justify-content: space-between; gap: 0.8rem; }
  .col-name { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; }
  .col-name .dept-dot { width: 0.8rem; height: 0.8rem; border-radius: 4px; }
  .col-stats { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 0.8rem; }
  .col-avg { font-size: 2.8rem; font-weight: 800; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .col-avg small { display: block; font-size: 0.75rem; font-weight: 600; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 0.35rem; }
  .col-avg i { font-style: normal; font-size: 1rem; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 0.3rem; }
  .col-trend { height: 3.2rem; margin-top: 0.7rem; }
  .col-meta { text-align: right; color: var(--ink-2); font-size: 0.95rem; line-height: 1.5; }
  .col-meta b { color: var(--ink); }
  .rows { display: flex; flex-direction: column; flex: 1; min-height: 0; padding: 0.4rem 1.4rem 0.8rem; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
  .row { display: grid; grid-template-columns: 1.3rem 2.8rem minmax(0, 1fr) 7rem; grid-template-rows: auto auto; column-gap: 0.75rem; row-gap: 0.4rem; align-items: center; padding: 0.65rem 0; border-bottom: 1px solid var(--grid); }
  .row .av { grid-row: span 2; }
  .row:last-child { border-bottom: 0; }
  .rank { grid-row: span 2; font-size: 1.05rem; font-weight: 700; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
  .rank.r1 { color: var(--warning-ink); }
  .rname { font-size: 1.2rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rscore { font-size: 1.25rem; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rscore small { font-size: 0.75rem; font-weight: 600; color: var(--muted); margin-left: 0.2rem; }
  .rbar { grid-column: 3 / 4; }
  .ravg { font-size: 0.8rem; color: var(--muted); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  /* people who also work in another department */
  .rname small { display: block; font-size: 0.78rem; font-weight: 500; color: var(--muted); overflow: hidden; text-overflow: ellipsis; margin-top: 0.05rem; }
  .rname small .dept-dot { width: 0.55em; height: 0.55em; margin-right: 0.3em; }
  #mtabs { display: none; }

  /* phones and tablets: one department at a time — tabs above, or swipe sideways */
  @media (max-width: 1023px) {
    #mtabs { display: flex; }
    .cols { grid-template-columns: minmax(0, 1fr) !important; height: auto; }
    .col { overflow: visible; }
    .col:not(.sel) { display: none; }
    .col-head { padding: 16px; }
    .col-avg { font-size: 2.4rem; }
    .col-stats { flex-wrap: wrap; align-items: flex-start; gap: 8px 12px; }
    .col-meta { text-align: left; flex: 1 1 100%; }
    .rows { overflow: visible; padding: 4px 16px 10px; }
    .row { grid-template-columns: 1.4rem 2.8rem minmax(0, 1fr) auto; column-gap: 10px; }
    .rname { font-size: 1.05rem; }
    .rscore { font-size: 1.1rem; }
  }
</style>
</head>
<body>
<div class="tv">
  <header class="tv-header" id="hdr"></header>
  <main class="tv-main"><nav class="chip-row" id="mtabs" aria-label="Department"></nav><div class="cols" id="cols"></div></main>
  <footer class="tv-footer" id="legend"></footer>
</div>
<script src="assets/core.js"></script>
<script>
const { CFG, esc, fmtNum, fmtFull, status } = KPI;
KPI.mountHeader(document.getElementById("hdr"), "Department Leaderboards", "tv-departments.html");
document.getElementById("legend").innerHTML =
  `${KPI.pill(CFG.THRESHOLDS.good / 100, `Above avg ≥ ${CFG.THRESHOLDS.good}%`)}
   ${KPI.pill(CFG.THRESHOLDS.warning / 100, `Near avg ${CFG.THRESHOLDS.warning}–${CFG.THRESHOLDS.good - 1}%`)}
   ${KPI.pill(0, `Below avg < ${CFG.THRESHOLDS.warning}%`)}
   <span class="legend-item">Ranked against the average of everyone on the same task today · tick on each bar = that average · bars stop at 150%</span>`;

// Phones / tablets show one department at a time: this one (tabs above, or swipe the list sideways)
let mSel = null, mNames = [];
const pickDept = (name) => {
  mSel = name; KPI.refresh();
  document.querySelector("#mtabs .on")?.scrollIntoView({ block: "nearest", inline: "center" });
};
document.getElementById("mtabs").onclick = (e) => { const b = e.target.closest("[data-d]"); if (b) pickDept(b.dataset.d); };
let touch = null;
document.getElementById("cols").addEventListener("touchstart", (e) => { touch = e.touches.length === 1 ? [e.touches[0].clientX, e.touches[0].clientY] : null; }, { passive: true });
document.getElementById("cols").addEventListener("touchend", (e) => {
  if (!touch) return;
  const dx = e.changedTouches[0].clientX - touch[0], dy = e.changedTouches[0].clientY - touch[1];
  touch = null;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  const i = mNames.indexOf(mSel) + (dx < 0 ? 1 : -1);
  if (i >= 0 && i < mNames.length) pickDept(mNames[i]);
});

KPI.autoRefresh((data) => {
  const day = KPI.displayDay(data);
  KPI.setHeaderDay(day);
  const people = KPI.summaries(data, day);
  const names = KPI.deptNames(data);
  const groups = names.map((n) => ({ name: n, people: KPI.deptPeople(data, people, n, day) })).filter((g) => g.people.length);
  mNames = groups.map((g) => g.name);
  if (!mNames.includes(mSel)) mSel = mNames[0] || null;
  document.getElementById("mtabs").innerHTML = groups.map((g) =>
    `<button type="button" data-d="${esc(g.name)}" class="${g.name === mSel ? "on" : ""}" aria-pressed="${g.name === mSel}"><span class="dept-dot" style="background:${KPI.deptColor(g.name)}"></span>${esc(g.name)}</button>`).join("");
  const el = document.getElementById("cols");
  // Columns share the width, but never get narrower than a readable leaderboard — then the page scrolls sideways.
  el.style.gridTemplateColumns = `repeat(${groups.length}, minmax(19rem, 1fr))`;
  el.innerHTML = groups.map((g) => {
    const dd = KPI.deptDay(data, g.name, day);
    const unit = KPI.unit(data, g.name);
    const weekAvg = KPI.deptWeekAvg(data, g.name, day);
    const vsWeek = dd.total != null && weekAvg ? dd.total / weekAvg : null;
    const above = g.people.filter((p) => p.dept && p.dept.ratio >= CFG.THRESHOLDS.good / 100).length;
    const color = KPI.deptColor(g.name);
    const weekPill = vsWeek == null ? KPI.pill(null) : KPI.pill(vsWeek, KPI.vsAvg(vsWeek).replace("vs avg", "vs 7-day").replace("at avg", "= 7-day avg"));
    const others = dd.others.map((o) => `+ <b>${fmtNum(o.total)}</b> ${esc(o.unit)}`).join("<br>");
    return `<section class="card col ${g.name === mSel ? "sel" : ""}" style="--dc:${color}">
      <div class="col-head">
        <div class="col-top"><div class="col-name"><span class="dept-dot" style="background:${color}"></span>${esc(g.name)}</div>${weekPill}</div>
        <div class="col-stats"><div class="col-avg">${dd.total == null ? "–" : fmtNum(dd.total)}<i>${esc(unit)}</i><small>Total ${esc(KPI.dayWord(day))}</small></div>
          <div class="col-meta">${others ? others + "<br>" : ""}<b>${dd.n}</b> of ${g.people.length} logged${dd.n ? ` · <b>${above}</b> above avg` : ""}</div></div>
        <div class="col-trend" title="Daily total in ${esc(unit)}, last 12 working days">${KPI.trendChart(KPI.deptSeries(data, g.name, day, 12), { mini: true, color })}</div>
      </div>
      <div class="rows">${g.people.map((p, i) => {
        const x = p.dept;
        const s = status(x ? x.ratio : null);
        // under the name: the jobs they did here today, else the other departments they work in
        const others = p.departments.filter((d) => d !== g.name);
        const sub = x ? `<small title="${esc(x.parts.map((t) => `${t.label}: ${fmtFull(t.qty)} ${t.unit}`).join("\n"))}">${esc(x.parts.map((t) => t.label).join(" · "))}</small>`
          : others.length ? `<small title="${esc(p.name)} also works in ${esc(others.join(", "))}">also ${others.map((d) => `<span class="dept-dot" style="background:${KPI.deptColor(d)}"></span>${esc(d)}`).join(", ")}</small>` : "";
        return `<div class="row">
          <div class="rank ${i === 0 && x ? "r1" : ""}">${x ? i + 1 : "–"}</div>
          ${KPI.avatar(p, { cls: "md", ring: s.key })}
          <div class="rname">${esc(p.name)}${sub}</div>
          <div class="rscore ${x ? "st st-" + s.key : "muted"}" title="${x ? esc(KPI.vsAvg(x.ratio)) : ""}">${x ? `${s.icon}${fmtFull(x.top.qty)}<small>${esc(x.top.unit)}</small>` : '<span style="font-size:0.9rem;font-weight:500">No entry</span>'}</div>
          <div class="rbar"><div class="bar"><span class="bg-${s.key}" style="width:${KPI.ratioW(x ? x.ratio : null)}%"></span><i class="tgt" style="left:${KPI.AVG_TICK}%"></i></div></div>
          <div class="ravg">${x ? `7d avg ${fmtNum(p.deptWeekAvg)}` : ""}</div>
        </div>`;
      }).join("")}</div>
    </section>`;
  }).join("") || '<div class="empty">No departments or employees yet — add them from the Admin page.</div>';
});
</script>
</body>
</html>
