<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Departments · Production KPI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/config.js"></script>
<script src="assets/theme.js"></script>
<style>
  .cols { display: grid; gap: 1.2rem; height: 100%; }
  .col { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .col-head { padding: 1.2rem 1.4rem 1rem; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, color-mix(in srgb, var(--dc) 10%, transparent), transparent); }
  .col-top { display: flex; align-items: center; justify-content: space-between; gap: 0.8rem; }
  .col-name { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; }
  .col-name .dept-dot { width: 0.8rem; height: 0.8rem; border-radius: 4px; }
  .col-stats { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 0.8rem; }
  .col-avg { font-size: 2.8rem; font-weight: 800; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .col-avg small { display: block; font-size: 0.75rem; font-weight: 600; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 0.35rem; }
  .col-trend { height: 3.2rem; margin-top: 0.7rem; }
  .col-meta { text-align: right; color: var(--ink-2); font-size: 0.95rem; line-height: 1.5; }
  .col-meta b { color: var(--ink); }
  .rows { display: flex; flex-direction: column; flex: 1; min-height: 0; padding: 0.4rem 1.4rem 0.8rem; }
  .row { display: grid; grid-template-columns: 1.3rem 2.8rem minmax(0, 1fr) 7rem; grid-template-rows: auto auto; column-gap: 0.75rem; row-gap: 0.4rem; align-items: center; padding: 0.65rem 0; border-bottom: 1px solid var(--grid); }
  .row .av { grid-row: span 2; }
  .row:last-child { border-bottom: 0; }
  .rank { grid-row: span 2; font-size: 1.05rem; font-weight: 700; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
  .rank.r1 { color: var(--warning-ink); }
  .rname { font-size: 1.2rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rscore { font-size: 1.25rem; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .rbar { grid-column: 3 / 4; }
  .ravg { font-size: 0.8rem; color: var(--muted); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  /* people who also work in another department */
  .rname small { display: block; font-size: 0.78rem; font-weight: 500; color: var(--muted); overflow: hidden; text-overflow: ellipsis; margin-top: 0.05rem; }
  .rname small .dept-dot { width: 0.55em; height: 0.55em; margin-right: 0.3em; }
</style>
</head>
<body>
<div class="tv">
  <header class="tv-header" id="hdr"></header>
  <main class="tv-main"><div class="cols" id="cols"></div></main>
  <footer class="tv-footer" id="legend"></footer>
</div>
<script src="assets/seed-data.js"></script>
<script src="assets/core.js"></script>
<script>
const { CFG, esc } = KPI;
KPI.mountHeader(document.getElementById("hdr"), "Department Leaderboards", "tv-departments.html");
document.getElementById("legend").innerHTML =
  `${KPI.pill(CFG.THRESHOLDS.good, `On target ≥ ${CFG.THRESHOLDS.good}%`)}
   ${KPI.pill(CFG.THRESHOLDS.warning, `Close ${CFG.THRESHOLDS.warning}–${CFG.THRESHOLDS.good - 1}%`)}
   ${KPI.pill(0, `Below ${CFG.THRESHOLDS.warning}%`)}
   <span class="legend-item">Tick on each bar = 100% of daily target · bars stop at 150% · people in two departments count only the tasks done for each</span>`;

const MAX = 150;
KPI.autoRefresh((data) => {
  const day = KPI.displayDay(data);
  KPI.setHeaderDay(day);
  const people = KPI.summaries(data, day);
  const names = KPI.deptNames();
  people.forEach((p) => p.departments.forEach((d) => { if (!names.includes(d)) names.push(d); }));
  // Someone in two departments is listed in both, scored only on the tasks that count for each.
  const groups = names.map((n) => ({
    name: n,
    people: people.filter((p) => p.departments.includes(n)).map((p) => ({ ...p, dept: KPI.deptSummary(data, p, n, day) })),
  })).filter((g) => g.people.length);
  const el = document.getElementById("cols");
  el.style.gridTemplateColumns = `repeat(${groups.length}, minmax(0, 1fr))`;
  el.innerHTML = groups.map((g) => {
    const ranked = [...g.people].sort((a, b) => (b.dept.score ?? -1) - (a.dept.score ?? -1) || a.name.localeCompare(b.name));
    const withData = ranked.filter((p) => p.dept.score != null);
    const avg = KPI.deptAvg(data, g.name, day);
    const onT = withData.filter((p) => p.dept.score >= CFG.THRESHOLDS.good).length;
    const st = KPI.status(avg);
    const color = KPI.deptColor(g.name);
    return `<section class="card col" style="--dc:${color}">
      <div class="col-head">
        <div class="col-top"><div class="col-name"><span class="dept-dot" style="background:${color}"></span>${esc(g.name)}</div>${KPI.pill(avg)}</div>
        <div class="col-stats"><div class="col-avg st-${st.key}">${avg == null ? "–" : Math.round(avg) + "%"}<small>Team average</small></div>
          <div class="col-meta"><b>${onT}</b> of ${withData.length} on target<br>${g.people.length} ${g.people.length === 1 ? "person" : "people"}</div></div>
        <div class="col-trend">${KPI.trendChart(KPI.deptSeries(data, g.name, day, 12), { mini: true, color })}</div>
      </div>
      <div class="rows">${ranked.map((p, i) => {
        const sc = p.dept.score;
        const s = KPI.status(sc);
        const has = sc != null;
        const w = has ? Math.min(sc, MAX) / MAX * 100 : 0;
        const others = p.departments.filter((d) => d !== g.name);
        const also = others.length ? `<small title="${esc(p.name)} also works in ${esc(others.join(", "))}">also ${others.map((d) => `<span class="dept-dot" style="background:${KPI.deptColor(d)}"></span>${esc(d)}`).join(", ")}${has && p.today.score != null && Math.round(p.today.score) !== Math.round(sc) ? ` · ${Math.round(p.today.score)}% total` : ""}</small>` : "";
        return `<div class="row">
          <div class="rank ${i === 0 && has ? "r1" : ""}">${has ? i + 1 : "–"}</div>
          ${KPI.avatar(p, { cls: "md", ring: s.key })}
          <div class="rname">${esc(p.name)}${also}</div>
          <div class="rscore ${has ? "st st-" + s.key : "muted"}">${has ? s.icon + Math.round(sc) + "%" : '<span style="font-size:0.9rem;font-weight:500">No entry</span>'}</div>
          <div class="rbar"><div class="bar"><span class="bg-${s.key}" style="width:${w}%"></span><i class="tgt" style="left:${100 / MAX * 100}%"></i></div></div>
          <div class="ravg">7d avg ${p.dept.weekAvg == null ? "–" : Math.round(p.dept.weekAvg) + "%"}</div>
        </div>`;
      }).join("")}</div>
    </section>`;
  }).join("") || '<div class="empty">No employees yet — add them from the Admin page.</div>';
});
</script>
</body>
</html>
